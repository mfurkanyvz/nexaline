services:
  - type: web
    name: nexaline
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 100 server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_DEBUG
        value: "0"
      - key: EXPOSE_VERIFICATION_CODES
        value: "0"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: nexalineapp@gmail.com
      - key: MAIL_FROM
        value: nexalineapp@gmail.com
      - key: SMTP_PASSWORD
        sync: false
