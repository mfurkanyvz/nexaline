services:
  - type: web
    name: nexaline-asistan
    runtime: static
    buildCommand: echo NexaLine static site ready
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(self), microphone=(self)
      - path: /downloads/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /app/*
        name: Cache-Control
        value: no-cache
