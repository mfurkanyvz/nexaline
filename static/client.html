<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10141d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NexaLine">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NexaLine</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        :root {
            --ink: #06080d;
            --panel: #10141d;
            --panel-2: #171c27;
            --panel-3: #202633;
            --line: #303746;
            --text: #eef4ff;
            --muted: #8993a7;
            --red: #f03d54;
            --blue: #2f8cff;
            --green: #2bd576;
            --shadow: 0 20px 70px rgba(0, 0, 0, 0.42);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 15% 0%, rgba(240, 61, 84, 0.18), transparent 28%),
                radial-gradient(circle at 85% 15%, rgba(47, 140, 255, 0.16), transparent 30%),
                linear-gradient(145deg, #030408, #10131b 55%, #05070c);
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .auth-screen {
            display: grid;
            min-height: 100vh;
            place-items: center;
            padding: 24px;
        }

        .auth-card {
            width: min(440px, 100%);
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(16, 20, 29, 0.92);
            box-shadow: var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand-mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border-radius: 8px;
            overflow: hidden;
            background: transparent;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
        }

        .brand-mark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: 0;
        }

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
            padding: 4px;
            border-radius: 8px;
            background: var(--ink);
        }

        .auth-tab {
            padding: 10px;
            border-radius: 6px;
            color: var(--muted);
            background: transparent;
        }

        .auth-tab.active {
            color: #fff;
            background: var(--panel-3);
        }

        .auth-progress {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 16px;
        }

        .auth-progress span {
            height: 4px;
            border-radius: 99px;
            background: var(--panel-3);
        }

        .auth-progress span.active {
            background: linear-gradient(135deg, var(--red), var(--blue));
        }

        .auth-fields {
            min-height: 54px;
        }

        .auth-fields.step-next {
            animation: authStepNext 220ms ease;
        }

        .auth-fields.step-back {
            animation: authStepBack 220ms ease;
        }

        @keyframes authStepNext {
            from {
                opacity: 0;
                transform: translateX(18px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes authStepBack {
            from {
                opacity: 0;
                transform: translateX(-18px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .field {
            width: 100%;
            margin-bottom: 12px;
            padding: 14px 15px;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            color: var(--text);
            background: #090c13;
        }

        .field:focus {
            border-color: var(--blue);
        }

        .primary {
            width: 100%;
            padding: 14px 18px;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            background: linear-gradient(135deg, var(--red), var(--blue));
        }

        .secondary {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            color: var(--text);
            font-weight: 700;
            border: 1px solid var(--line);
            background: var(--panel-2);
        }

        .auth-actions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .auth-actions.with-back {
            grid-template-columns: 0.42fr 1fr;
        }

        .text-btn {
            width: 100%;
            padding: 10px;
            color: var(--muted);
            background: transparent;
        }

        .status-line {
            min-height: 22px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 14px;
        }

        .app {
            display: grid;
            grid-template-columns: 380px minmax(0, 1fr);
            height: 100vh;
            background: rgba(3, 5, 9, 0.42);
        }

        .sidebar {
            display: flex;
            min-width: 0;
            flex-direction: column;
            border-right: 1px solid var(--line);
            background: rgba(16, 20, 29, 0.96);
        }

        .topbar,
        .chat-top {
            display: flex;
            min-height: 72px;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        .avatar {
            display: grid;
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            place-items: center;
            border-radius: 50%;
            overflow: hidden;
            color: #fff;
            font-weight: 800;
            background: linear-gradient(135deg, #323949, #151923);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar.online {
            box-shadow: 0 0 0 2px var(--green);
        }

        .identity {
            min-width: 0;
            flex: 1;
        }

        .identity strong,
        .chat-title {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .identity small,
        .last-message,
        .section-label {
            color: var(--muted);
            font-size: 12px;
        }

        .icon-row {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border-radius: 8px;
            color: var(--text);
            background: var(--panel-3);
        }

        .search-box {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid var(--line);
        }

        .nav-tabs {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 4px;
            padding: 8px;
            border-bottom: 1px solid var(--line);
            background: #090c13;
        }

        .nav-tab {
            min-width: 0;
            padding: 9px 4px;
            border-radius: 7px;
            color: var(--muted);
            background: transparent;
            font-size: 12px;
            font-weight: 700;
        }

        .nav-tab.active {
            color: #fff;
            background: var(--panel-3);
        }

        .search-box input {
            min-width: 0;
            flex: 1;
            padding: 12px;
            border: 1px solid transparent;
            border-radius: 8px;
            outline: none;
            color: var(--text);
            background: #090c13;
        }

        .section-label {
            padding: 12px 16px 6px;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .scroll-area {
            min-height: 0;
            overflow: auto;
        }

        .chat-list {
            max-height: 42vh;
            overflow: auto;
        }

        .story-list {
            max-height: 20vh;
            overflow: auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .contact-list {
            overflow: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-item,
        .story-item,
        .call-item,
        .contact-item {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr) auto;
            gap: 12px;
            width: 100%;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text);
            text-align: left;
            background: transparent;
        }

        .chat-item.active {
            background: rgba(47, 140, 255, 0.16);
        }

        .chat-item:hover,
        .story-item:hover,
        .call-item:hover,
        .contact-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .admin-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 6px;
            color: #07100b;
            background: var(--green);
            font-size: 11px;
            font-weight: 700;
        }

        .member-action {
            display: none;
        }

        .member-action.visible {
            display: grid;
        }

        .chat-time {
            color: var(--muted);
            font-size: 12px;
        }

        .badge {
            display: inline-grid;
            min-width: 22px;
            height: 22px;
            place-items: center;
            padding: 0 6px;
            border-radius: 999px;
            color: #fff;
            background: var(--blue);
            font-size: 12px;
            font-weight: 800;
        }

        .chat-side {
            display: grid;
            justify-items: end;
            gap: 6px;
        }

        .online-dot {
            width: 9px;
            height: 9px;
            align-self: center;
            border-radius: 50%;
            background: #596173;
        }

        .online-dot.online {
            background: var(--green);
        }

        .chat-pane {
            display: grid;
            min-width: 0;
            grid-template-rows: 72px 1fr auto;
            background:
                linear-gradient(rgba(4, 6, 10, 0.82), rgba(4, 6, 10, 0.82)),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 18px);
        }

        .messages {
            display: flex;
            overflow: auto;
            flex-direction: column;
            gap: 8px;
            padding: 22px;
        }

        .bubble {
            max-width: min(72%, 680px);
            padding: 10px 12px 8px;
            border-radius: 8px;
            line-height: 1.35;
            background: var(--panel-3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        }

        .bubble.mine {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(240, 61, 84, 0.86), rgba(47, 140, 255, 0.86));
        }

        .sender {
            margin-bottom: 3px;
            color: #a8c9ff;
            font-size: 12px;
            font-weight: 700;
        }

        .bubble.mine .sender {
            display: none;
        }

        .bubble img {
            display: block;
            max-width: 260px;
            max-height: 220px;
            margin-top: 6px;
            border-radius: 8px;
        }

        .bubble video,
        .story-media {
            display: block;
            max-width: 100%;
            max-height: 58vh;
            margin-top: 10px;
            border-radius: 8px;
            background: #000;
        }

        .file-pill {
            display: inline-flex;
            max-width: 100%;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            padding: 8px 10px;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.22);
        }

        .message-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            color: rgba(255, 255, 255, 0.72);
            font-size: 11px;
        }

        .reply-preview,
        .reply-context {
            margin-bottom: 7px;
            padding: 7px 9px;
            border-left: 3px solid var(--blue);
            border-radius: 6px;
            color: #cbd8ee;
            background: rgba(0, 0, 0, 0.22);
            font-size: 12px;
        }

        .reply-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            grid-column: 1 / -1;
            margin: 0;
        }

        .reply-close {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
        }

        .reply-action {
            margin-left: 8px;
            color: rgba(255, 255, 255, 0.78);
            background: transparent;
            font-size: 12px;
        }

        .message-menu {
            color: rgba(255, 255, 255, 0.78);
            background: transparent;
            font-size: 12px;
        }

        .deleted-message {
            color: rgba(255, 255, 255, 0.68);
            font-style: italic;
        }

        .ticks.read {
            color: #024fba;
            font-weight: 900;
        }

        .ticks.delivered {
            color: rgba(255, 255, 255, 0.82);
        }

        .composer {
            display: grid;
            grid-template-columns: 44px 44px 44px 44px 44px minmax(0, 1fr) 44px;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid var(--line);
            background: var(--panel);
        }

        .composer.replying {
            grid-template-rows: auto auto;
        }

        .composer textarea {
            grid-column: 5 / 7;
            min-height: 44px;
            max-height: 120px;
            resize: none;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            color: var(--text);
            background: #090c13;
        }

        #cancelVoiceButton:not(.hidden) ~ #messageInput {
            grid-column: 6 / 7;
        }

        #sendButton {
            grid-column: 7;
        }

        .send-btn {
            border-radius: 8px;
            color: #fff;
            background: var(--red);
        }

        .recording {
            background: var(--red);
            color: #fff;
        }

        .voice-message {
            width: min(260px, 100%);
            margin-top: 6px;
        }

        .voice-wave {
            display: none;
            grid-column: 1 / -1;
            align-items: end;
            height: 34px;
            gap: 3px;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(240, 61, 84, 0.14);
        }

        .voice-wave.active {
            display: flex;
        }

        .voice-wave span {
            width: 4px;
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--red), var(--blue));
        }

        #activeStatus {
            cursor: pointer;
        }

        .emoji-panel {
            display: flex;
            grid-column: 1 / -1;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #090c13;
        }

        .emoji-panel button {
            width: 34px;
            height: 34px;
            border-radius: 7px;
            background: var(--panel-3);
        }

        .location-pill {
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }

        .call-panel {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.72);
        }

        .settings-panel {
            position: fixed;
            inset: 0;
            z-index: 12;
            display: grid;
            place-items: center;
            padding: 18px;
            background: rgba(0, 0, 0, 0.76);
        }

        .toast-stack {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 30;
            display: grid;
            gap: 8px;
            width: min(360px, calc(100vw - 32px));
        }

        .toast {
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .modal-panel {
            position: fixed;
            inset: 0;
            z-index: 25;
            display: grid;
            place-items: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.76);
        }

        .modal-box {
            width: min(560px, 100%);
            max-height: calc(100dvh - 32px);
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .modal-head,
        .modal-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px;
            border-bottom: 1px solid var(--line);
        }

        .modal-actions {
            justify-content: flex-end;
            border-top: 1px solid var(--line);
            border-bottom: 0;
        }

        .modal-body {
            display: grid;
            gap: 12px;
            padding: 14px;
        }

        .modal-body input,
        .modal-body textarea,
        .settings-box input,
        .settings-box textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 7px;
            outline: none;
            color: var(--text);
            background: #090c13;
        }

        .modal-body textarea,
        .settings-box textarea {
            min-height: 86px;
            resize: vertical;
        }

        .check-list {
            display: grid;
            max-height: 260px;
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .check-row,
        .member-row {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .check-row:last-child,
        .member-row:last-child {
            border-bottom: 0;
        }

        .mini-btn {
            width: auto;
            min-width: 0;
            padding: 8px 10px;
            border-radius: 7px;
            color: #fff;
            background: var(--panel-3);
        }

        .profile-preview {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .settings-box {
            width: min(460px, 100%);
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .settings-head,
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .settings-row {
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .settings-row button {
            min-width: 118px;
            padding: 10px;
            border-radius: 7px;
            color: #fff;
            background: var(--panel-3);
        }

        .story-panel {
            position: fixed;
            inset: 0;
            z-index: 11;
            display: grid;
            place-items: center;
            padding: 18px;
            background: rgba(0, 0, 0, 0.78);
        }

        .story-box {
            width: min(520px, 100%);
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .story-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .call-box {
            width: min(820px, 100%);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .video-stage {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #05070c;
        }

        .video-stage video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #05070c;
        }

        #localVideo {
            position: absolute;
            right: 14px;
            bottom: 14px;
            width: min(180px, 32%);
            height: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }

        .call-info,
        .call-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
        }

        .call-info {
            justify-content: space-between;
            border-top: 1px solid var(--line);
        }

        .call-actions {
            justify-content: center;
        }

        .danger {
            background: var(--red);
        }

        .accept {
            background: var(--green);
            color: #07100b;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 760px) {
            body {
                overflow: hidden;
                overscroll-behavior: none;
            }

            .app {
                grid-template-columns: 1fr;
                height: 100dvh;
            }

            .sidebar {
                display: flex;
                width: 100%;
                height: 100dvh;
                min-height: 0;
            }

            .chat-pane {
                display: none;
                height: 100dvh;
                grid-template-rows: 64px minmax(0, 1fr) auto;
            }

            .app.chat-open .sidebar {
                display: none;
            }

            .app.chat-open .chat-pane {
                display: grid;
            }

            .app.chat-open #backButton {
                display: grid !important;
            }

            .topbar,
            .chat-top {
                min-height: 64px;
                padding: 10px 12px;
            }

            .topbar .identity,
            .chat-top .identity {
                min-width: 0;
            }

            .topbar .icon-row,
            .chat-top .icon-row {
                flex: 0 0 auto;
            }

            .avatar {
                width: 40px;
                height: 40px;
                flex-basis: 40px;
                font-size: 14px;
            }

            .icon-row {
                gap: 6px;
            }

            .icon-btn {
                width: 36px;
                height: 36px;
            }

            .topbar .icon-btn,
            .chat-top .icon-btn {
                width: 34px;
                height: 34px;
                font-size: 13px;
            }

            .search-box {
                padding: 10px;
            }

            .chat-list {
                max-height: none;
                min-height: 0;
                flex: 1;
            }

            .story-list {
                max-height: none;
                min-height: 0;
                flex: 1;
            }

            .chat-item,
            .story-item,
            .call-item,
            .contact-item {
                grid-template-columns: 44px minmax(0, 1fr) auto;
                padding: 11px 12px;
            }

            .messages {
                padding: 14px 10px;
                padding-bottom: 18px;
            }

            .bubble {
                max-width: 88%;
                font-size: 14px;
            }

            .bubble img,
            .bubble video {
                max-width: min(100%, 280px);
                max-height: 42dvh;
            }

            .composer {
                grid-template-columns: 38px 38px 38px 38px 38px minmax(0, 1fr) 38px;
                gap: 7px;
                padding: 8px;
                padding-bottom: max(8px, env(safe-area-inset-bottom));
            }

            .composer textarea {
                min-height: 40px;
                padding: 10px 12px;
                font-size: 14px;
            }

            .call-panel {
                padding: 10px;
            }

            .call-box {
                width: 100%;
                max-height: calc(100dvh - 20px);
            }

            .video-stage {
                height: min(64dvh, 620px);
                aspect-ratio: auto;
            }

            #localVideo {
                right: 10px;
                bottom: 10px;
                width: min(38%, 150px);
            }

            .call-info,
            .call-actions {
                padding: 10px;
            }

            .nav-tabs {
                grid-template-columns: repeat(5, max-content);
                overflow-x: auto;
                scrollbar-width: none;
            }

            .nav-tab {
                min-width: 68px;
                padding: 9px 10px;
            }

            .toast-stack {
                right: 10px;
                bottom: max(10px, env(safe-area-inset-bottom));
                width: calc(100vw - 20px);
            }

            .modal-panel {
                align-items: end;
                padding: 10px;
            }

            .modal-box {
                width: 100%;
                max-height: calc(100dvh - 20px);
            }
        }

        @media (max-width: 420px) {
            .brand h1 {
                font-size: 26px;
            }

            .auth-card {
                padding: 22px;
            }

            .identity strong,
            .chat-title {
                font-size: 15px;
            }

            .topbar {
                gap: 8px;
            }

            .topbar .icon-row {
                gap: 4px;
            }

            .topbar .icon-btn {
                width: 31px;
                height: 31px;
            }

            .identity small,
            .last-message,
            .section-label,
            .chat-time {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <main id="authScreen" class="auth-screen">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-mark"><img src="/static/nexaline-mark.png" alt="NexaLine"></div>
                <h1>NexaLine</h1>
            </div>

            <div class="auth-tabs">
                <button id="loginTab" class="auth-tab active" type="button">Giriş</button>
                <button id="registerTab" class="auth-tab" type="button">Kayıt</button>
            </div>

            <div id="registerProgress" class="auth-progress hidden" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div id="authFields" class="auth-fields">
                <input id="username" class="field" autocomplete="username" placeholder="Kullanıcı adı">
                <input id="email" class="field hidden" autocomplete="email" placeholder="Gmail adresi">
                <input id="verificationCode" class="field hidden" inputmode="numeric" maxlength="6" placeholder="Gmail doğrulama kodu">
                <input id="password" class="field" autocomplete="current-password" type="password" placeholder="Şifre">
                <input id="confirmPassword" class="field hidden" autocomplete="new-password" type="password" placeholder="Şifreyi tekrar yaz">
            </div>

            <div id="authActions" class="auth-actions">
                <button id="authBackButton" class="secondary hidden" type="button">Geri</button>
                <button id="authButton" class="primary" type="button">Giriş Yap</button>
            </div>
            <button id="forgotButton" class="text-btn" type="button">Şifremi unuttum</button>
            <div id="authStatus" class="status-line"></div>
        </section>
    </main>

    <main id="app" class="app hidden">
        <aside id="sidebar" class="sidebar">
            <header class="topbar">
                <div id="meAvatar" class="avatar">NL</div>
                <div class="identity">
                    <strong id="meName">NexaLine</strong>
                    <small id="meStatus">çevrimiçi</small>
                </div>
                <div class="icon-row">
                    <button class="icon-btn" id="storyButton" title="Durum ekle">◉</button>
                    <button class="icon-btn" id="newGroupButton" title="Grup oluştur">＋</button>
                    <button class="icon-btn" id="settingsButton" title="Ayarlar">⚙</button>
                </div>
            </header>

            <div class="search-box">
                <input id="searchInput" placeholder="Sohbetlerde ve kişilerde ara">
            </div>

            <nav class="nav-tabs">
                <button class="nav-tab active" data-section="chats" type="button">Sohbet</button>
                <button class="nav-tab" data-section="groups" type="button">Grup</button>
                <button class="nav-tab" data-section="stories" type="button">Durum</button>
                <button class="nav-tab" data-section="calls" type="button">Arama</button>
                <button class="nav-tab" data-section="contacts" type="button">Kişi</button>
            </nav>

            <div id="sectionTitle" class="section-label">Sohbetler</div>
            <nav id="storyList" class="story-list hidden"></nav>
            <nav id="chatList" class="chat-list"></nav>
            <nav id="groupList" class="chat-list hidden"></nav>
            <nav id="callList" class="chat-list hidden"></nav>
            <nav id="contactList" class="contact-list scroll-area hidden"></nav>
        </aside>

        <section class="chat-pane">
            <header class="chat-top">
                <button id="backButton" class="icon-btn hidden" title="Sohbetler">←</button>
                <div id="activeAvatar" class="avatar">NL</div>
                <div class="identity">
                    <strong id="activeTitle">Genel Grup</strong>
                    <small id="activeStatus">hazır</small>
                </div>
                <div class="icon-row">
                    <button class="icon-btn member-action" id="groupMembersButton" title="Üyeleri yönet">☰</button>
                    <button class="icon-btn hidden" id="leaveGroupButton" title="Gruptan çık">⇥</button>
                    <button class="icon-btn" id="callButton" title="Sesli arama">☎</button>
                    <button class="icon-btn" id="videoButton" title="Görüntülü arama">▣</button>
                </div>
            </header>

            <div id="messages" class="messages"></div>

            <footer class="composer">
                <div id="replyPreview" class="reply-preview hidden"></div>
                <div id="voiceWave" class="voice-wave"></div>
                <div id="emojiPanel" class="emoji-panel hidden"></div>
                <button id="attachButton" class="icon-btn" title="Dosya">＋</button>
                <button id="voiceButton" class="icon-btn" title="Sesli mesaj">●</button>
                <button id="emojiButton" class="icon-btn" title="Emoji">☺</button>
                <button id="locationButton" class="icon-btn" title="Konum">⌖</button>
                <button id="cancelVoiceButton" class="icon-btn danger hidden" title="Kaydı iptal et">×</button>
                <input id="fileInput" class="hidden" type="file" accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.zip">
                <input id="storyFileInput" class="hidden" type="file" accept="image/*,video/*">
                <textarea id="messageInput" placeholder="Mesaj"></textarea>
                <button id="sendButton" class="send-btn" title="Gönder">➤</button>

    <section id="storyPanel" class="story-panel hidden">
        <div class="story-box">
            <div class="story-head">
                <div>
                    <strong id="storyTitle">Durum</strong>
                    <div id="storyMeta" class="last-message"></div>

                <button id="closeStoryButton" class="icon-btn" type="button">×</button>

        </div>

    <section id="settingsPanel" class="settings-panel hidden">
        <div class="settings-box">
            <div class="settings-head">
                <div>
                    <strong>Ayarlar</strong>
                    <div id="settingsEmail" class="last-message"></div>
                </div>
                <button id="closeSettingsButton" class="icon-btn" type="button">×</button>
            </div>
            <div class="settings-row">
                <div>
                    <strong>Profil</strong>
                    <div class="last-message">Fotoğraf, görünen ad ve hakkımda</div>
                </div>
                <div id="settingsAvatar" class="avatar">NL</div>
            </div>
            <input id="profileImageInput" class="hidden" type="file" accept="image/*">
            <div class="settings-row">
                <button id="profileImageButton" type="button">Fotoğraf Seç</button>
                <button id="removeProfileImageButton" type="button">Fotoğrafı Sil</button>
            </div>
            <input id="displayNameInput" placeholder="Görünen ad">
            <textarea id="aboutInput" placeholder="Hakkımda"></textarea>
            <button id="saveProfileButton" class="primary" type="button">Profili Kaydet</button>
            <div class="settings-row">
                <div>
                    <strong>Gmail</strong>
                    <div class="last-message">Doğrulama kodu ile değişir</div>
                </div>
                <button id="changeEmailButton" type="button">Değiştir</button>
            </div>
            <div class="settings-row">
                <div>
                    <strong>Şifre</strong>
                    <div class="last-message">Mevcut şifre gerekir</div>
                </div>
                <button id="changePasswordButton" type="button">Değiştir</button>
            </div>
            <div class="settings-row">
                <div>
                    <strong>Hesap</strong>
                    <div class="last-message">Çıkış veya hesabı sil</div>
                </div>
                <button id="settingsLogoutButton" type="button">Çıkış</button>
            </div>
            <button id="settingsDeleteButton" class="primary" type="button">Hesabı Sil</button>
        </div>
    </section>

    <section id="modalPanel" class="modal-panel hidden">
        <div class="modal-box">
            <div class="modal-head">
                <strong id="modalTitle">NexaLine</strong>
                <button id="modalCloseButton" class="icon-btn" type="button">×</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
            <div id="modalActions" class="modal-actions"></div>
        </div>
    </section>

    <div id="toastStack" class="toast-stack"></div>

    <section id="callPanel" class="call-panel hidden">
        <div class="call-box">
            <div class="video-stage">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="call-info">
                <strong id="callTitle">Arama</strong>
                <span id="callStatus">bağlanıyor</span>
            </div>
            <div class="call-actions">
                <button id="acceptCallButton" class="icon-btn accept hidden" title="Kabul et">✓</button>
                <button id="muteButton" class="icon-btn" title="Mikrofon">♫</button>
                <button id="cameraButton" class="icon-btn" title="Kamera">▣</button>
                <button id="switchCameraButton" class="icon-btn" title="Kamerayı çevir">⇄</button>
                <button id="endCallButton" class="icon-btn danger" title="Bitir">×</button>
            </div>
        </div>
    </section>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js").catch(error => console.warn("PWA kaydı yapılamadı", error));
            });
        }

        const socket = io();
        let rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
        const state = {
            mode: "login",
            registerStep: 0,
            registerVerifiedCode: "",
            awaitingRegisterVerification: false,
            pendingRegister: null,
            me: null,
            users: [],
            chats: [],
            stories: [],
            callLogs: [],
            contactRequests: [],
            groupInvites: [],
            blockedUsers: [],
            activeSection: "chats",
            activeChatId: "lobby",
            typing: {},
            attachment: null,
            replyTo: null,
            waveTimer: null,
            pendingStoryBody: "",
            generalGroup: null,
            generalPromptShown: false,
            recorder: null,
            recordedChunks: [],
            cancelRecording: false,
            profileImageDraft: null,
            call: {
                peers: {},
                pendingIce: {},
                localStream: null,
                remoteStream: null,
                chatId: null,
                audioOnly: false,
                incomingOffer: null,
                startedAt: null,
                ringtoneTimer: null,
                cameraFacing: "user"
            }
        };

        const $ = (id) => document.getElementById(id);
        const EMOJIS = ["😀", "😂", "😍", "🥰", "😎", "😢", "😡", "👍", "👏", "🙏", "❤️", "🔥", "🎉", "✅", "📍", "☕"];

        function showToast(message) {
            const item = document.createElement("div");
            item.className = "toast";
            item.textContent = message;
            $("toastStack").appendChild(item);
            setTimeout(() => item.remove(), 3600);
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function closeModal() {
            $("modalPanel").classList.add("hidden");
            $("modalBody").innerHTML = "";
            $("modalActions").innerHTML = "";
        }

        function openModal(title, buildBody, actions = []) {
            $("modalTitle").textContent = title;
            const body = $("modalBody");
            const actionBar = $("modalActions");
            body.innerHTML = "";
            actionBar.innerHTML = "";
            buildBody(body);
            actions.forEach(action => {
                const button = document.createElement("button");
                button.className = action.primary ? "primary mini-btn" : "mini-btn";
                button.type = "button";
                button.textContent = action.label;
                button.onclick = () => action.onClick?.();
                actionBar.appendChild(button);
            });
            $("modalPanel").classList.remove("hidden");
        }

        function confirmModal(title, message, onConfirm) {
            openModal(title, body => {
                const text = document.createElement("p");
                text.textContent = message;
                body.appendChild(text);
            }, [
                { label: "Vazgeç", onClick: closeModal },
                { label: "Tamam", primary: true, onClick: () => { closeModal(); onConfirm?.(); } }
            ]);
        }

        function setAvatar(element, userOrTitle, fallbackText) {
            const image = userOrTitle?.profileImage || userOrTitle?.image;
            element.innerHTML = "";
            if (image) {
                const img = document.createElement("img");
                img.src = image;
                img.alt = fallbackText || userOrTitle.displayName || userOrTitle.title || "NexaLine";
                element.appendChild(img);
            } else {
                element.textContent = initials(fallbackText || userOrTitle?.displayName || userOrTitle?.title || userOrTitle || "NL");
            }
        }

        function unreadCount(chat) {
            return chat.messages.filter(message => message.sender !== state.me.username && !message.readBy.includes(state.me.username)).length;
        }

        function otherMember(chat) {
            return chat?.members.find(member => member.username !== state.me.username);
        }

        function contactRequestWith(username) {
            return state.contactRequests.find(item => {
                const from = item.from?.username;
                const to = item.to?.username;
                return (from === state.me.username && to === username) || (to === state.me.username && from === username);
            });
        }

        function contactStatus(username) {
            if (state.blockedUsers.includes(username)) {
                return "blocked";
            }
            const request = contactRequestWith(username);
            if (!request) {
                return "none";
            }
            if (request.status === "accepted") {
                return "accepted";
            }
            if (request.status === "pending" && request.to?.username === state.me.username) {
                return "incoming";
            }
            if (request.status === "pending") {
                return "outgoing";
            }
            return "none";
        }

        function hydrateRealtimeState(data) {
            state.contactRequests = data.contactRequests || state.contactRequests || [];
            state.groupInvites = data.groupInvites || state.groupInvites || [];
            state.blockedUsers = data.blockedUsers || state.blockedUsers || [];
        }

        function isMobileView() {
            return window.matchMedia("(max-width: 760px)").matches;
        }

        function openMobileChat() {
            if (isMobileView()) {
                $("app").classList.add("chat-open");
            }
        }

        function closeMobileChat() {
            $("app").classList.remove("chat-open");
        }

        function setAuthMode(mode) {
            state.mode = mode;
            state.registerStep = 0;
            state.registerVerifiedCode = "";
            state.awaitingRegisterVerification = false;
            state.pendingRegister = null;
            $("verificationCode").value = "";
            $("confirmPassword").value = "";
            $("authStatus").textContent = "";
            updateAuthView();
        }

        function updateAuthView(direction = "next") {
            const isRegister = state.mode === "register";
            const step = state.registerStep;
            const show = (id, visible) => $(id).classList.toggle("hidden", !visible);

            $("loginTab").classList.toggle("active", !isRegister);
            $("registerTab").classList.toggle("active", isRegister);
            show("registerProgress", isRegister);
            show("username", !isRegister || step === 0);
            show("email", isRegister && step === 1);
            show("verificationCode", isRegister && step === 2);
            show("password", !isRegister || step === 3);
            show("confirmPassword", isRegister && step === 3);
            show("forgotButton", !isRegister);
            show("authBackButton", isRegister && step > 0);

            $("authActions").classList.toggle("with-back", isRegister && step > 0);
            $("password").autocomplete = isRegister ? "new-password" : "current-password";
            $("password").placeholder = isRegister ? "Güçlü şifre" : "Şifre";
            $("authButton").textContent = !isRegister
                ? "Giriş Yap"
                : step === 3
                    ? "Hesabı Oluştur"
                    : "Devam";

            document.querySelectorAll("#registerProgress span").forEach((item, index) => {
                item.classList.toggle("active", isRegister && index <= step);
            });

            if (isRegister && !$("authStatus").textContent) {
                const hints = [
                    "Önce benzersiz kullanıcı adını yaz.",
                    "Gmail adresine doğrulama kodu göndereceğiz.",
                    "Gmail'e gelen 6 haneli kodu yaz.",
                    "Güçlü şifreni iki kez yaz."
                ];
                $("authStatus").textContent = hints[step];
            }

            animateAuthFields(direction);
            setTimeout(() => {
                if (isRegister) {
                    const focusIds = ["username", "email", "verificationCode", "password"];
                    $(focusIds[step])?.focus();
                } else {
                    $("username").focus();
                }
            }, 80);
        }

        function animateAuthFields(direction) {
            const fields = $("authFields");
            fields.classList.remove("step-next", "step-back");
            void fields.offsetWidth;
            fields.classList.add(direction === "back" ? "step-back" : "step-next");
        }

        function setRegisterStep(step, direction = "next") {
            state.registerStep = Math.max(0, Math.min(3, step));
            $("authStatus").textContent = "";
            updateAuthView(direction);
        }

        function goBackAuthStep() {
            if (state.mode === "register" && state.registerStep > 0) {
                setRegisterStep(state.registerStep - 1, "back");
            }
        }

        async function submitAuth() {
            if (state.mode === "register") {
                await submitRegisterStep();
                return;
            }

            const username = $("username").value.trim();
            const password = $("password").value;
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();

            if (!data.ok) {
                $("authStatus").textContent = data.message;
                return;
            }

            state.me = data.user;
            localStorage.setItem("nexalineUser", username.toLowerCase());
            openApp();
        }

        async function submitRegisterStep() {
            const username = $("username").value.trim().toLowerCase();
            const email = $("email").value.trim();
            const code = $("verificationCode").value.trim();
            const password = $("password").value;
            const confirmPassword = $("confirmPassword").value;

            if (state.registerStep === 0) {
                const response = await fetch("/register/check-username", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username })
                });
                const data = await response.json();
                if (!data.ok) {
                    $("authStatus").textContent = data.message;
                    return;
                }
                state.pendingRegister = { username, email: "" };
                setRegisterStep(1);
                return;
            }

            if (state.registerStep === 1) {
                const payload = { username: state.pendingRegister?.username || username, email };
                const response = await fetch("/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (!data.ok) {
                    $("authStatus").textContent = data.message;
                    return;
                }
                state.awaitingRegisterVerification = true;
                state.pendingRegister = payload;
                setRegisterStep(2);
                $("authStatus").textContent = data.devCode ? `${data.message} Kod: ${data.devCode}` : data.message;
                return;
            }

            if (state.registerStep === 2) {
                const response = await fetch("/register/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ...state.pendingRegister, code })
                });
                const data = await response.json();
                if (!data.ok) {
                    $("authStatus").textContent = data.message;
                    return;
                }
                state.registerVerifiedCode = code;
                setRegisterStep(3);
                $("authStatus").textContent = data.message;
                return;
            }

            if (password !== confirmPassword) {
                $("authStatus").textContent = "Yazdığın iki şifre aynı değil.";
                return;
            }

            const response = await fetch("/register/verify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    ...state.pendingRegister,
                    code: state.registerVerifiedCode,
                    password,
                    confirmPassword
                })
            });
            const data = await response.json();
            if (!data.ok) {
                $("authStatus").textContent = data.message;
                return;
            }

            state.me = data.user;
            localStorage.setItem("nexalineUser", data.user.username);
            openApp();
        }

        async function openApp() {
            $("authScreen").classList.add("hidden");
            $("app").classList.remove("hidden");
            await loadRtcConfig();
            socket.emit("user:join", { username: state.me.username });
            await loadBootstrap();
        }

        async function loadRtcConfig() {
            try {
                const response = await fetch("/rtc-config");
                const data = await response.json();
                if (data.ok && Array.isArray(data.iceServers)) {
                    rtcConfig = { iceServers: data.iceServers };
                }
            } catch (error) {
                console.warn("Arama ayarları yüklenemedi", error);
            }
        }

        async function loadBootstrap() {
            if (!state.me) {
                return;
            }

            const response = await fetch(`/bootstrap/${state.me.username}`);
            const data = await response.json();

            if (data.ok) {
                state.me = data.user;
                state.users = data.users;
                state.chats = data.chats;
                state.generalGroup = data.generalGroup;
                state.stories = data.stories || [];
                state.callLogs = data.callLogs || [];
                hydrateRealtimeState(data);
                state.activeChatId = state.chats[0]?.id || "lobby";
                render();
                maybePromptGeneralGroup();
            }
        }

        function render() {
            renderProfile();
            renderSections();
            renderStories();
            renderChats();
            renderGroups();
            renderCalls();
            renderContacts();
            renderActiveChat();
        }

        function renderProfile() {
            setAvatar($("meAvatar"), state.me, state.me.displayName);
            $("meAvatar").classList.add("online");
            $("meAvatar").onclick = () => showStoryForUser(state.me.username);
            $("meName").textContent = state.me.displayName;
        }

        function renderSections() {
            const labels = {
                chats: "Sohbetler",
                groups: "Gruplar",

        function showStoryForUser(username) {
            const stories = state.stories.filter(story => story.username === username);
            if (!stories.length) {
                if (username === state.me.username) {
                    createStory();
                    return;
                }
                showToast("Bu kullanıcının aktif durumu yok.");
                return;
            }

            showStory(stories[0]);
        }

        function showStory(story) {
            const expires = new Date(story.expiresAt).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
            $("storyTitle").textContent = `${story.user.displayName} (@${story.username})`;
            $("storyMeta").textContent = `${relativeTime(story.createdAt)} paylaşıldı • Bitiş: ${expires}`;
            const body = $("storyBody");
            body.innerHTML = "";
            if (story.body) {
                const text = document.createElement("p");
                text.textContent = story.body;
                body.appendChild(text);
            }
            if (story.attachment) {
                body.appendChild(renderStoryAttachment(story.attachment));
            }
            if (story.username === state.me.username) {
                const deleteButton = document.createElement("button");
                deleteButton.className = "mini-btn danger";
                deleteButton.type = "button";
                deleteButton.textContent = "Durumu Sil";
                deleteButton.onclick = () => {
                    socket.emit("story:delete", { storyId: story.id });
                    closeStoryPanel();
                };
                body.appendChild(deleteButton);
            }
            $("storyPanel").classList.remove("hidden");
        }

        function closeStoryPanel() {
            $("storyPanel").classList.add("hidden");
            $("storyBody").innerHTML = "";
        }

        function renderStoryAttachment(attachment) {
            if (attachment.type?.startsWith("video/")) {
                const video = document.createElement("video");
                video.className = "story-media";
                video.controls = true;
                video.playsInline = true;
                video.src = attachment.dataUrl;
                return video;
            }
            if (attachment.type?.startsWith("image/")) {
                const image = document.createElement("img");
                image.className = "story-media";
                image.src = attachment.dataUrl;
                image.alt = attachment.name || "Durum";
                return image;
            }
            const link = document.createElement("a");
            link.className = "file-pill";
            link.href = attachment.dataUrl;
            link.download = attachment.name || "durum";
            link.textContent = attachment.name || "Dosya";
            return link;

        function renderContacts() {
            const filter = $("searchInput").value.trim().toLowerCase();
            const contactList = $("contactList");
            contactList.innerHTML = "";

            state.users
                .filter(user => user.username !== state.me.username)
                .filter(user => user.displayName.toLowerCase().includes(filter) || user.username.toLowerCase().includes(filter))
                .forEach(user => {
                    const button = document.createElement("button");

                    avatar.className = "avatar" + (user.online ? " online" : "");

                    avatar.onclick = event => {
                        event.stopPropagation();
                        showStoryForUser(user.username);
                    };

        function contactLine(user) {
            const status = contactStatus(user.username);
            if (status === "accepted") {
                return user.online ? "çevrimiçi" : `son görülme ${relativeTime(user.lastSeen)}`;
            }
            if (status === "incoming") {
                return "Mesajlaşma isteği geldi";
            }
            if (status === "outgoing") {
                return "İstek gönderildi, bekliyor";
            }
            if (status === "blocked") {
                return "Engelledin";
            }
            return user.online ? "çevrimiçi • istek gönder" : `son görülme ${relativeTime(user.lastSeen)} • istek gönder`;
        }

        function handleContactAction(user) {
            const status = contactStatus(user.username);
            const request = contactRequestWith(user.username);
            if (status === "incoming" && request) {
                confirmModal("Mesajlaşma isteği", `${user.displayName} ile mesajlaşmayı kabul ediyor musun?`, () => {
                    socket.emit("contact:respond", { requestId: request.id, accept: true });
                });
                return;
            }
            if (status === "blocked") {
                confirmModal("Engeli kaldır", `${user.displayName} yeniden mesaj ve arama gönderebilsin mi?`, () => {
                    socket.emit("user:block", { username: user.username, blocked: false });
                });
                return;
            }
            if (status === "accepted") {
                openModal(user.displayName, body => {
                    const text = document.createElement("p");
                    text.textContent = "Bu kişiyle sohbet edebilir, arayabilir veya engelleyebilirsin.";
                    body.appendChild(text);
                }, [
                    { label: "Sohbeti Aç", primary: true, onClick: () => { closeModal(); socket.emit("chat:create", { target: user.username }); } },
                    { label: "Engelle", onClick: () => {
                        closeModal();
                        socket.emit("user:block", { username: user.username, blocked: true });
                    } }
                ]);
                return;
            }
            if (status === "outgoing") {
                showToast("İstek zaten gönderildi.");
                return;
            }
            confirmModal("Mesajlaşma isteği", `${user.displayName} kişisine mesajlaşma isteği gönderilsin mi?`, () => {
                socket.emit("chat:create", { target: user.username });
            });
        }

        function renderActiveChat() {
            const chat = activeChat();
            const messageBox = $("messages");

            if (!chat) {
                messageBox.innerHTML = "";
                return;
            }

            $("activeTitle").textContent = chat.title;
            setAvatar($("activeAvatar"), chat.type === "direct" ? otherMember(chat) : chat, chat.title);
            $("activeAvatar").classList.toggle("online", isChatOnline(chat));
            $("activeStatus").textContent = statusText(chat);
            $("leaveGroupButton").classList.toggle("hidden", chat.type !== "group");
            const me = chat.members.find(member => member.username === state.me.username);
            $("groupMembersButton").classList.toggle("visible", chat.type === "group" && chat.id !== "lobby" && Boolean(me?.isAdmin));
            messageBox.innerHTML = "";

            chat.messages.forEach(message => {
                const mine = message.sender === state.me.username;
                const bubble = document.createElement("article");
                bubble.className = "bubble" + (mine ? " mine" : "");

                const sender = document.createElement("div");
                sender.className = "sender";
                sender.textContent = message.senderName;
                bubble.appendChild(sender);

                if (message.deletedAt) {
                    const deleted = document.createElement("div");
                    deleted.className = "deleted-message";
                    deleted.textContent = "Bu mesaj silindi";
                    bubble.appendChild(deleted);
                } else if (message.replyTo) {
                    const reply = document.createElement("div");
                    reply.className = "reply-context";
                    reply.textContent = `${message.replyTo.senderName}: ${message.replyTo.body || message.replyTo.attachmentName || "Mesaj"}`;
                    bubble.appendChild(reply);
                }

                if (!message.deletedAt && message.body) {
                    const text = document.createElement("div");
                    text.textContent = message.body;
                    bubble.appendChild(text);
                }

                if (!message.deletedAt && message.attachment) {
                    bubble.appendChild(renderAttachment(message.attachment));
                }

                if (message.reactions && Object.keys(message.reactions).length) {
                    const reactions = document.createElement("div");
                    reactions.className = "last-message";
                    reactions.textContent = Object.values(message.reactions).join(" ");
                    bubble.appendChild(reactions);
                }

                const meta = document.createElement("div");
                meta.className = "message-meta";
                const read = chat.members.some(member => member.username !== state.me.username && message.readBy.includes(member.username));
                const delivered = mine && !read && isDelivered(chat, message);
                meta.innerHTML = `<button class="reply-action" type="button">Yanıtla</button><button class="reply-action react-action" type="button">Tepki</button><button class="message-menu" type="button">Sil</button><span>${formatTime(message.createdAt)}</span><span class="ticks ${read ? "read" : delivered ? "delivered" : ""}">${mine ? (read || delivered ? "✓✓" : "✓") : ""}</span>`;
                meta.querySelector(".reply-action").onclick = event => {
                    event.stopPropagation();
                    setReplyTo(message);
                };
                meta.querySelector(".message-menu").onclick = event => {
                    event.stopPropagation();
                    openMessageMenu(message);
                };
                meta.querySelector(".react-action").onclick = event => {
                    event.stopPropagation();
                    openReactionMenu(message);
                };
                bubble.appendChild(meta);
                let touchStartX = 0;
                bubble.addEventListener("touchstart", event => {
                    touchStartX = event.changedTouches[0].clientX;
                }, { passive: true });
                bubble.addEventListener("touchend", event => {
                    if (Math.abs(event.changedTouches[0].clientX - touchStartX) > 55) {
                        setReplyTo(message);
                    }
                }, { passive: true });
                messageBox.appendChild(bubble);
            });

            messageBox.scrollTop = messageBox.scrollHeight;
            if (!isMobileView() || $("app").classList.contains("chat-open")) {
                socket.emit("message:read", { chatId: chat.id });
            }
        }

        function isDelivered(chat, message) {
            if (chat.type === "direct") {
                return chat.members.some(member => member.username !== state.me.username && member.online);
            }
            return chat.members.some(member => member.username !== state.me.username && member.online);
        }

        function openMessageMenu(message) {
            const mine = message.sender === state.me.username;
            const actions = [
                {
                    label: "Benden sil",
                    onClick: () => {
                        closeModal();
                        socket.emit("message:delete", { messageId: message.id, scope: "me" });
                    }
                }
            ];
            if (mine || activeChat()?.members.find(member => member.username === state.me.username)?.isAdmin) {
                actions.push({
                    label: "Herkesten sil",
                    primary: true,
                    onClick: () => {
                        closeModal();
                        socket.emit("message:delete", { messageId: message.id, scope: "all" });
                    }
                });
            }
            openModal("Mesaj", body => {
                const text = document.createElement("p");
                text.textContent = message.deletedAt ? "Silinmiş mesaj" : (message.body || message.attachment?.name || "Mesaj");
                body.appendChild(text);
            }, actions);
        }

        function openReactionMenu(message) {
            openModal("Tepki ver", body => {
                const panel = document.createElement("div");
                panel.className = "emoji-panel";
                ["👍", "❤️", "😂", "😮", "😢", "🙏"].forEach(emoji => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.textContent = emoji;
                    button.onclick = () => {
                        socket.emit("message:react", { messageId: message.id, emoji });
                        closeModal();
                    };
                    panel.appendChild(button);
                });
                body.appendChild(panel);
            }, [{ label: "Vazgeç", onClick: closeModal }]);
        }

        function renderAttachment(attachment) {
            if (attachment.type === "call") {
                const pill = document.createElement("div");
                pill.className = "file-pill";
                const label = attachment.kind === "video" ? "Görüntülü arama" : "Sesli arama";
                pill.textContent = attachment.status === "active"
                    ? `${label} aktif`
                    : `${label}: ${formatDuration(attachment.durationSeconds || 0)}`;
                return pill;
            }

            if (attachment.type && attachment.type.startsWith("audio/")) {
                const audio = document.createElement("audio");
                audio.className = "voice-message";
                audio.controls = true;
                audio.src = attachment.dataUrl;
                return audio;
            }

            if (attachment.type?.startsWith("video/")) {
                const video = document.createElement("video");
                video.className = "story-media";
                video.controls = true;
                video.playsInline = true;
                video.src = attachment.dataUrl;
                return video;
            }

            if (attachment.type && attachment.type.startsWith("image/")) {
                const image = document.createElement("img");
                image.src = attachment.dataUrl;
                image.alt = attachment.name;
                return image;
            }

            if (attachment.type === "location") {
                const link = document.createElement("a");
                link.className = "file-pill location-pill";
                link.href = attachment.url;
                link.target = "_blank";
                link.rel = "noreferrer";
                link.textContent = `📍 Konum: ${Number(attachment.lat).toFixed(5)}, ${Number(attachment.lng).toFixed(5)}`;
                return link;
            }

            const link = document.createElement("a");
            link.className = "file-pill";
            link.href = attachment.dataUrl;
            link.download = attachment.name;
            link.textContent = `Dosya: ${attachment.name}`;
            return link;
        }

        function sendMessage() {
            const input = $("messageInput");
            const body = input.value.trim();
            const chat = activeChat();

            if (!chat || (!body && !state.attachment)) {
                return;
            }

            socket.emit("message:send", { chatId: chat.id, body, attachment: state.attachment, replyTo: state.replyTo });
            socket.emit("typing", { chatId: chat.id, typing: false });
            input.value = "";
            input.placeholder = "Mesaj";
            state.attachment = null;
            clearReply();
        }

        function toggleEmojiPanel() {
            const panel = $("emojiPanel");
            if (panel.innerHTML === "") {
                EMOJIS.forEach(emoji => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.textContent = emoji;
                    button.onclick = () => {
                        $("messageInput").value += emoji;
                        $("messageInput").focus();
                    };
                    panel.appendChild(button);
                });
            }
            panel.classList.toggle("hidden");
        }

        function sendCurrentLocation() {
            const chat = activeChat();
            if (!chat || !navigator.geolocation) {
                showToast("Konum bu cihazda desteklenmiyor.");
                return;
            }
            showToast("Konum alınıyor...");
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                socket.emit("message:send", {
                    chatId: chat.id,
                    body: "Mevcut konumum",
                    attachment: {
                        type: "location",
                        name: "Konum",
                        lat,
                        lng,
                        url: `https://www.google.com/maps?q=${lat},${lng}`
                    },
                    replyTo: state.replyTo
                });
                clearReply();
            }, () => showToast("Konum izni alınamadı."), { enableHighAccuracy: true, timeout: 12000 });
        }

        function setReplyTo(message) {
            state.replyTo = {
                id: message.id,
                senderName: message.senderName,
                body: message.body,
                attachmentName: message.attachment?.name
            };
            renderReplyPreview();
            $("messageInput").focus();
        }

        function clearReply() {

        async function toggleVoiceRecording() {
            if (state.recorder && state.recorder.state === "recording") {
                state.recorder.stop();
                $("voiceButton").classList.remove("recording");
                $("voiceButton").textContent = "●";
                $("cancelVoiceButton").classList.add("hidden");
                stopVoiceWave();
                return;
            }

            if (!navigator.mediaDevices || !window.MediaRecorder) {
                showToast("Bu tarayıcı sesli mesaj kaydını desteklemiyor.");
                return;
            }

            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (error) {
                showToast("Mikrofon izni alınamadı.");
                return;
            }
            state.recordedChunks = [];
            state.cancelRecording = false;
            state.recorder = new MediaRecorder(stream);
            startVoiceWave(stream);
            state.recorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    state.recordedChunks.push(event.data);
                }
            };
            state.recorder.onstop = () => {
                stream.getTracks().forEach(track => track.stop());
                stopVoiceWave();
                $("cancelVoiceButton").classList.add("hidden");
                if (state.cancelRecording) {
                    state.recordedChunks = [];
                    $("messageInput").placeholder = "Mesaj";
                    return;
                }
                const blob = new Blob(state.recordedChunks, { type: "audio/webm" });
                const reader = new FileReader();
                reader.onload = () => {
                    state.attachment = {
                        name: `sesli-mesaj-${Date.now()}.webm`,
                        type: "audio/webm",
                        dataUrl: reader.result
                    };
                    $("messageInput").placeholder = "Sesli mesaj hazır";
                };
                reader.readAsDataURL(blob);
            };
            state.recorder.start();
            $("voiceButton").classList.add("recording");
            $("voiceButton").textContent = "■";
            $("cancelVoiceButton").classList.remove("hidden");
        }

        function cancelVoiceRecording() {

                $("cancelVoiceButton").classList.add("hidden");

            }
        }

        function formatTime(value) {
            return new Date(value).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
        }

        function relativeTime(value) {
            const seconds = Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 1000));
            if (seconds < 60) {
                return `${seconds || 1} sn önce`;
            }
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) {
                return `${minutes} dk önce`;
            }
            const hours = Math.floor(minutes / 60);
            if (hours < 24) {
                return `${hours} saat önce`;
            }
            const days = Math.floor(hours / 24);
            return `${days} gün önce`;
        }

        function formatDuration(seconds) {
            seconds = Math.max(0, Number(seconds) || 0);
            const minutes = Math.floor(seconds / 60);
            const remaining = seconds % 60;
            return minutes ? `${minutes} dk ${remaining} sn` : `${remaining} sn`;
        }

        function startVoiceWave(stream) {
            const wave = $("voiceWave");
            wave.innerHTML = Array.from({ length: 28 }, () => "<span></span>").join("");
            wave.classList.add("active");
            const bars = [...wave.querySelectorAll("span")];
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 64;
            audioContext.createMediaStreamSource(stream).connect(analyser);
            const data = new Uint8Array(analyser.frequencyBinCount);
            state.waveTimer = setInterval(() => {
                analyser.getByteFrequencyData(data);
                bars.forEach((bar, index) => {
                    const value = data[index % data.length] || 8;
                    bar.style.height = `${8 + Math.round((value / 255) * 25)}px`;
                });
            }, 80);
            wave.dataset.audioContext = "active";
            wave._audioContext = audioContext;
        }

        function stopVoiceWave() {
            if (state.waveTimer) {
                clearInterval(state.waveTimer);
                state.waveTimer = null;
            }
            if ($("voiceWave")._audioContext) {
                $("voiceWave")._audioContext.close();
                $("voiceWave")._audioContext = null;
            }
            $("voiceWave").classList.remove("active");
        }

        function playTone(frequency, duration) {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                oscillator.frequency.value = frequency;
                oscillator.connect(gain);
                gain.connect(context.destination);
                gain.gain.setValueAtTime(0.001, context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.08, context.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + duration);
                oscillator.start();
                oscillator.stop(context.currentTime + duration);
            } catch (error) {
                // Ses izni olmayan tarayıcılarda sessiz geç.
            }
        }

            reader.onload = () => onLoad(reader.result);

                showToast("Dosya boyutu 5 MB altında olmalı.");

                    type: file.type || "application/octet-stream",
                    dataUrl: reader.result
                };
                $("messageInput").placeholder = file.name;
