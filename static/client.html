<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaLine</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        :root {
            --ink: #06080d;
            --panel: #10141d;
            --panel-2: #171c27;
            --panel-3: #202633;
            --line: #303746;
            --text: #eef4ff;
            --muted: #8993a7;
            --red: #f03d54;
            --blue: #2f8cff;
            --green: #2bd576;
            --shadow: 0 20px 70px rgba(0, 0, 0, 0.42);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 15% 0%, rgba(240, 61, 84, 0.18), transparent 28%),
                radial-gradient(circle at 85% 15%, rgba(47, 140, 255, 0.16), transparent 30%),
                linear-gradient(145deg, #030408, #10131b 55%, #05070c);
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .auth-screen {
            display: grid;
            min-height: 100vh;
            place-items: center;
            padding: 24px;
        }

        .auth-card {
            width: min(440px, 100%);
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(16, 20, 29, 0.92);
            box-shadow: var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand-mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border-radius: 8px;
            overflow: hidden;
            background: transparent;
            color: #fff;
            font-size: 22px;
            font-weight: 800;
        }

        .brand-mark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: 0;
        }

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
            padding: 4px;
            border-radius: 8px;
            background: var(--ink);
        }

        .auth-tab {
            padding: 10px;
            border-radius: 6px;
            color: var(--muted);
            background: transparent;
        }

        .auth-tab.active {
            color: #fff;
            background: var(--panel-3);
        }

        .field {
            width: 100%;
            margin-bottom: 12px;
            padding: 14px 15px;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            color: var(--text);
            background: #090c13;
        }

        .field:focus {
            border-color: var(--blue);
        }

        .primary {
            width: 100%;
            padding: 14px 18px;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            background: linear-gradient(135deg, var(--red), var(--blue));
        }

        .status-line {
            min-height: 22px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 14px;
        }

        .app {
            display: grid;
            grid-template-columns: 380px minmax(0, 1fr);
            height: 100vh;
            background: rgba(3, 5, 9, 0.42);
        }

        .sidebar {
            display: flex;
            min-width: 0;
            flex-direction: column;
            border-right: 1px solid var(--line);
            background: rgba(16, 20, 29, 0.96);
        }

        .topbar,
        .chat-top {
            display: flex;
            min-height: 72px;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        .avatar {
            display: grid;
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            place-items: center;
            border-radius: 50%;
            color: #fff;
            font-weight: 800;
            background: linear-gradient(135deg, #323949, #151923);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .avatar.online {
            box-shadow: 0 0 0 2px var(--green);
        }

        .identity {
            min-width: 0;
            flex: 1;
        }

        .identity strong,
        .chat-title {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .identity small,
        .last-message,
        .section-label {
            color: var(--muted);
            font-size: 12px;
        }

        .icon-row {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border-radius: 8px;
            color: var(--text);
            background: var(--panel-3);
        }

        .search-box {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid var(--line);
        }

        .nav-tabs {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 4px;
            padding: 8px;
            border-bottom: 1px solid var(--line);
            background: #090c13;
        }

        .nav-tab {
            min-width: 0;
            padding: 9px 4px;
            border-radius: 7px;
            color: var(--muted);
            background: transparent;
            font-size: 12px;
            font-weight: 700;
        }

        .nav-tab.active {
            color: #fff;
            background: var(--panel-3);
        }

        .search-box input {
            min-width: 0;
            flex: 1;
            padding: 12px;
            border: 1px solid transparent;
            border-radius: 8px;
            outline: none;
            color: var(--text);
            background: #090c13;
        }

        .section-label {
            padding: 12px 16px 6px;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .scroll-area {
            min-height: 0;
            overflow: auto;
        }

        .chat-list {
            max-height: 42vh;
            overflow: auto;
        }

        .story-list {
            max-height: 20vh;
            overflow: auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .contact-list {
            overflow: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-item,
        .story-item,
        .call-item,
        .contact-item {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr) auto;
            gap: 12px;
            width: 100%;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text);
            text-align: left;
            background: transparent;
        }

        .chat-item.active {
            background: rgba(47, 140, 255, 0.16);
        }

        .chat-item:hover,
        .story-item:hover,
        .call-item:hover,
        .contact-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .admin-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 6px;
            color: #07100b;
            background: var(--green);
            font-size: 11px;
            font-weight: 700;
        }

        .member-action {
            display: none;
        }

        .member-action.visible {
            display: grid;
        }

        .chat-time {
            color: var(--muted);
            font-size: 12px;
        }

        .online-dot {
            width: 9px;
            height: 9px;
            align-self: center;
            border-radius: 50%;
            background: #596173;
        }

        .online-dot.online {
            background: var(--green);
        }

        .chat-pane {
            display: grid;
            min-width: 0;
            grid-template-rows: 72px 1fr auto;
            background:
                linear-gradient(rgba(4, 6, 10, 0.82), rgba(4, 6, 10, 0.82)),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 18px);
        }

        .messages {
            display: flex;
            overflow: auto;
            flex-direction: column;
            gap: 8px;
            padding: 22px;
        }

        .bubble {
            max-width: min(72%, 680px);
            padding: 10px 12px 8px;
            border-radius: 8px;
            line-height: 1.35;
            background: var(--panel-3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        }

        .bubble.mine {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(240, 61, 84, 0.86), rgba(47, 140, 255, 0.86));
        }

        .sender {
            margin-bottom: 3px;
            color: #a8c9ff;
            font-size: 12px;
            font-weight: 700;
        }

        .bubble.mine .sender {
            display: none;
        }

        .bubble img {
            display: block;
            max-width: 260px;
            max-height: 220px;
            margin-top: 6px;
            border-radius: 8px;
        }

        .bubble video,
        .story-media {
            display: block;
            max-width: 100%;
            max-height: 58vh;
            margin-top: 10px;
            border-radius: 8px;
            background: #000;
        }

        .file-pill {
            display: inline-flex;
            max-width: 100%;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            padding: 8px 10px;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.22);
        }

        .message-meta {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 4px;
            color: rgba(255, 255, 255, 0.72);
            font-size: 11px;
        }

        .reply-preview,
        .reply-context {
            margin-bottom: 7px;
            padding: 7px 9px;
            border-left: 3px solid var(--blue);
            border-radius: 6px;
            color: #cbd8ee;
            background: rgba(0, 0, 0, 0.22);
            font-size: 12px;
        }

        .reply-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            grid-column: 1 / -1;
            margin: 0;
        }

        .reply-close {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
        }

        .reply-action {
            margin-left: 8px;
            color: rgba(255, 255, 255, 0.78);
            background: transparent;
            font-size: 12px;
        }

        .ticks.read {
            color: #75c9ff;
        }

        .composer {
            display: grid;
            grid-template-columns: 44px 44px 1fr 44px;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid var(--line);
            background: var(--panel);
        }

        .composer.replying {
            grid-template-rows: auto auto;
        }

        .composer textarea {
            min-height: 44px;
            max-height: 120px;
            resize: none;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            color: var(--text);
            background: #090c13;
        }

        .send-btn {
            border-radius: 8px;
            color: #fff;
            background: var(--red);
        }

        .recording {
            background: var(--red);
            color: #fff;
        }

        .voice-message {
            width: min(260px, 100%);
            margin-top: 6px;
        }

        .voice-wave {
            display: none;
            grid-column: 1 / -1;
            align-items: end;
            height: 34px;
            gap: 3px;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(240, 61, 84, 0.14);
        }

        .voice-wave.active {
            display: flex;
        }

        .voice-wave span {
            width: 4px;
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(180deg, var(--red), var(--blue));
        }

        #activeStatus {
            cursor: pointer;
        }

        .call-panel {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.72);
        }

        .story-panel {
            position: fixed;
            inset: 0;
            z-index: 11;
            display: grid;
            place-items: center;
            padding: 18px;
            background: rgba(0, 0, 0, 0.78);
        }

        .story-box {
            width: min(520px, 100%);
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .story-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .call-box {
            width: min(820px, 100%);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .video-stage {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #05070c;
        }

        .video-stage video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #05070c;
        }

        #localVideo {
            position: absolute;
            right: 14px;
            bottom: 14px;
            width: min(180px, 32%);
            height: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }

        .call-info,
        .call-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
        }

        .call-info {
            justify-content: space-between;
            border-top: 1px solid var(--line);
        }

        .call-actions {
            justify-content: center;
        }

        .danger {
            background: var(--red);
        }

        .accept {
            background: var(--green);
            color: #07100b;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 760px) {
            body {
                overflow: hidden;
                overscroll-behavior: none;
            }

            .app {
                grid-template-columns: 1fr;
                height: 100dvh;
            }

            .sidebar {
                display: flex;
                width: 100%;
                height: 100dvh;
            }

            .chat-pane {
                display: none;
                height: 100dvh;
                grid-template-rows: 64px minmax(0, 1fr) auto;
            }

            .app.chat-open .sidebar {
                display: none;
            }

            .app.chat-open .chat-pane {
                display: grid;
            }

            .app.chat-open #backButton {
                display: grid !important;
            }

            .topbar,
            .chat-top {
                min-height: 64px;
                padding: 10px 12px;
            }

            .topbar .identity,
            .chat-top .identity {
                min-width: 0;
            }

            .topbar .icon-row,
            .chat-top .icon-row {
                flex: 0 0 auto;
            }

            .avatar {
                width: 40px;
                height: 40px;
                flex-basis: 40px;
                font-size: 14px;
            }

            .icon-row {
                gap: 6px;
            }

            .icon-btn {
                width: 36px;
                height: 36px;
            }

            .topbar .icon-btn,
            .chat-top .icon-btn {
                width: 34px;
                height: 34px;
                font-size: 13px;
            }

            .search-box {
                padding: 10px;
            }

            .chat-list {
                max-height: none;
                min-height: 0;
                flex: 1;
            }

            .story-list {
                max-height: none;
                min-height: 0;
                flex: 1;
            }

            .chat-item,
            .story-item,
            .call-item,
            .contact-item {
                grid-template-columns: 44px minmax(0, 1fr) auto;
                padding: 11px 12px;
            }

            .messages {
                padding: 14px 10px;
                padding-bottom: 18px;
            }

            .bubble {
                max-width: 88%;
                font-size: 14px;
            }

            .bubble img,
            .bubble video {
                max-width: min(100%, 280px);
                max-height: 42dvh;
            }

            .composer {
                grid-template-columns: 38px 38px minmax(0, 1fr) 38px;
                gap: 7px;
                padding: 8px;
                padding-bottom: max(8px, env(safe-area-inset-bottom));
            }

            .composer textarea {
                min-height: 40px;
                padding: 10px 12px;
                font-size: 14px;
            }

            .call-panel {
                padding: 10px;
            }

            .call-box {
                width: 100%;
                max-height: calc(100dvh - 20px);
            }

            .video-stage {
                height: min(64dvh, 620px);
                aspect-ratio: auto;
            }

            #localVideo {
                right: 10px;
                bottom: 10px;
                width: min(38%, 150px);
            }

            .call-info,
            .call-actions {
                padding: 10px;
            }

            .nav-tabs {
                grid-template-columns: repeat(5, max-content);
                overflow-x: auto;
                scrollbar-width: none;
            }

            .nav-tab {
                min-width: 68px;
                padding: 9px 10px;
            }
        }

        @media (max-width: 420px) {
            .brand h1 {
                font-size: 26px;
            }

            .auth-card {
                padding: 22px;
            }

            .identity strong,
            .chat-title {
                font-size: 15px;
            }

            .topbar {
                gap: 8px;
            }

            .topbar .icon-row {
                gap: 4px;
            }

            .topbar .icon-btn {
                width: 31px;
                height: 31px;
            }

            .identity small,
            .last-message,
            .section-label,
            .chat-time {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <main id="authScreen" class="auth-screen">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-mark"><img src="/static/nexaline-mark.png" alt="NexaLine"></div>
                <h1>NexaLine</h1>
            </div>

            <div class="auth-tabs">
                <button id="loginTab" class="auth-tab active" type="button">Giriş</button>
                <button id="registerTab" class="auth-tab" type="button">Kayıt</button>
            </div>

            <input id="displayName" class="field hidden" autocomplete="name" placeholder="Görünen ad">
            <input id="username" class="field" autocomplete="username" placeholder="Kullanıcı adı">
            <input id="password" class="field" autocomplete="current-password" type="password" placeholder="Güçlü şifre">
            <button id="authButton" class="primary" type="button">Giriş Yap</button>
            <div id="authStatus" class="status-line"></div>
        </section>
    </main>

    <main id="app" class="app hidden">
        <aside id="sidebar" class="sidebar">
            <header class="topbar">
                <div id="meAvatar" class="avatar">NL</div>
                <div class="identity">
                    <strong id="meName">NexaLine</strong>
                    <small id="meStatus">çevrimiçi</small>
                </div>
                <div class="icon-row">
                    <button class="icon-btn" id="storyButton" title="Durum ekle">◉</button>
                    <button class="icon-btn" id="newGroupButton" title="Grup oluştur">＋</button>
                    <button class="icon-btn" id="deleteAccountButton" title="Hesabı sil">⌫</button>
                    <button class="icon-btn" id="logoutButton" title="Çıkış">⏻</button>
                </div>
            </header>

            <div class="search-box">
                <input id="searchInput" placeholder="Sohbetlerde ve kişilerde ara">
            </div>

            <nav class="nav-tabs">
                <button class="nav-tab active" data-section="chats" type="button">Sohbet</button>
                <button class="nav-tab" data-section="groups" type="button">Grup</button>
                <button class="nav-tab" data-section="stories" type="button">Durum</button>
                <button class="nav-tab" data-section="calls" type="button">Arama</button>
                <button class="nav-tab" data-section="contacts" type="button">Kişi</button>
            </nav>

            <div id="sectionTitle" class="section-label">Sohbetler</div>
            <nav id="storyList" class="story-list hidden"></nav>
            <nav id="chatList" class="chat-list"></nav>
            <nav id="groupList" class="chat-list hidden"></nav>
            <nav id="callList" class="chat-list hidden"></nav>
            <nav id="contactList" class="contact-list scroll-area hidden"></nav>
        </aside>

        <section class="chat-pane">
            <header class="chat-top">
                <button id="backButton" class="icon-btn hidden" title="Sohbetler">←</button>
                <div id="activeAvatar" class="avatar">NL</div>
                <div class="identity">
                    <strong id="activeTitle">Genel Grup</strong>
                    <small id="activeStatus">hazır</small>
                </div>
                <div class="icon-row">
                    <button class="icon-btn member-action" id="groupMembersButton" title="Üyeleri yönet">☰</button>
                    <button class="icon-btn hidden" id="leaveGroupButton" title="Gruptan çık">⇥</button>
                    <button class="icon-btn" id="callButton" title="Sesli arama">☎</button>
                    <button class="icon-btn" id="videoButton" title="Görüntülü arama">▣</button>
                </div>
            </header>

            <div id="messages" class="messages"></div>

            <footer class="composer">
                <div id="replyPreview" class="reply-preview hidden"></div>
                <div id="voiceWave" class="voice-wave"></div>
                <button id="attachButton" class="icon-btn" title="Dosya">＋</button>
                <button id="voiceButton" class="icon-btn" title="Sesli mesaj">●</button>
                <input id="fileInput" class="hidden" type="file" accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.zip">
                <input id="storyFileInput" class="hidden" type="file" accept="image/*,video/*">
                <textarea id="messageInput" placeholder="Mesaj"></textarea>
                <button id="sendButton" class="send-btn" title="Gönder">➤</button>
            </footer>
        </section>
    </main>

    <section id="storyPanel" class="story-panel hidden">
        <div class="story-box">
            <div class="story-head">
                <div>
                    <strong id="storyTitle">Durum</strong>
                    <div id="storyMeta" class="last-message"></div>
                </div>
                <button id="closeStoryButton" class="icon-btn" type="button">×</button>
            </div>
            <div id="storyBody"></div>
        </div>
    </section>

    <section id="callPanel" class="call-panel hidden">
        <div class="call-box">
            <div class="video-stage">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="call-info">
                <strong id="callTitle">Arama</strong>
                <span id="callStatus">bağlanıyor</span>
            </div>
            <div class="call-actions">
                <button id="acceptCallButton" class="icon-btn accept hidden" title="Kabul et">✓</button>
                <button id="muteButton" class="icon-btn" title="Mikrofon">♫</button>
                <button id="cameraButton" class="icon-btn" title="Kamera">▣</button>
                <button id="endCallButton" class="icon-btn danger" title="Bitir">×</button>
            </div>
        </div>
    </section>

    <script>
        const socket = io();
        let rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
        const state = {
            mode: "login",
            me: null,
            users: [],
            chats: [],
            stories: [],
            callLogs: [],
            activeSection: "chats",
            activeChatId: "lobby",
            typing: {},
            attachment: null,
            replyTo: null,
            waveTimer: null,
            pendingStoryBody: "",
            generalGroup: null,
            generalPromptShown: false,
            recorder: null,
            recordedChunks: [],
            call: {
                peers: {},
                pendingIce: {},
                localStream: null,
                remoteStream: null,
                chatId: null,
                audioOnly: false,
                incomingOffer: null,
                startedAt: null
            }
        };

        const $ = (id) => document.getElementById(id);

        function isMobileView() {
            return window.matchMedia("(max-width: 760px)").matches;
        }

        function openMobileChat() {
            if (isMobileView()) {
                $("app").classList.add("chat-open");
            }
        }

        function closeMobileChat() {
            $("app").classList.remove("chat-open");
        }

        function setAuthMode(mode) {
            state.mode = mode;
            $("loginTab").classList.toggle("active", mode === "login");
            $("registerTab").classList.toggle("active", mode === "register");
            $("displayName").classList.toggle("hidden", mode === "login");
            $("password").autocomplete = mode === "login" ? "current-password" : "new-password";
            $("authButton").textContent = mode === "login" ? "Giriş Yap" : "Kayıt Ol";
            $("authStatus").textContent = mode === "register"
                ? "Kullanıcı adı ve görünen isim benzersiz olmalı. Şifre en az 10 karakter, büyük/küçük harf, sayı ve özel karakter içermeli."
                : "";
        }

        async function submitAuth() {
            const username = $("username").value.trim();
            const password = $("password").value;
            const displayName = $("displayName").value.trim();
            const endpoint = state.mode === "login" ? "/login" : "/register";

            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password, displayName })
            });
            const data = await response.json();

            if (!data.ok) {
                $("authStatus").textContent = data.message;
                return;
            }

            state.me = data.user;
            localStorage.setItem("nexalineUser", username.toLowerCase());
            openApp();
        }

        async function openApp() {
            $("authScreen").classList.add("hidden");
            $("app").classList.remove("hidden");
            await loadRtcConfig();
            socket.emit("user:join", { username: state.me.username });
            await loadBootstrap();
        }

        async function loadRtcConfig() {
            try {
                const response = await fetch("/rtc-config");
                const data = await response.json();
                if (data.ok && Array.isArray(data.iceServers)) {
                    rtcConfig = { iceServers: data.iceServers };
                }
            } catch (error) {
                console.warn("Arama ayarları yüklenemedi", error);
            }
        }

        async function loadBootstrap() {
            if (!state.me) {
                return;
            }

            const response = await fetch(`/bootstrap/${state.me.username}`);
            const data = await response.json();

            if (data.ok) {
                state.me = data.user;
                state.users = data.users;
                state.chats = data.chats;
                state.generalGroup = data.generalGroup;
                state.stories = data.stories || [];
                state.callLogs = data.callLogs || [];
                state.activeChatId = state.chats[0]?.id || "lobby";
                render();
                maybePromptGeneralGroup();
            }
        }

        function render() {
            renderProfile();
            renderSections();
            renderStories();
            renderChats();
            renderGroups();
            renderCalls();
            renderContacts();
            renderActiveChat();
        }

        function renderProfile() {
            $("meAvatar").textContent = initials(state.me.displayName);
            $("meAvatar").classList.add("online");
            $("meAvatar").onclick = () => showStoryForUser(state.me.username);
            $("meName").textContent = state.me.displayName;
        }

        function renderSections() {
            const labels = {
                chats: "Sohbetler",
                groups: "Gruplar",
                stories: "Durumlar",
                calls: "Arama kayıtları",
                contacts: "Kişiler"
            };
            document.querySelectorAll(".nav-tab").forEach(tab => {
                tab.classList.toggle("active", tab.dataset.section === state.activeSection);
            });
            $("sectionTitle").textContent = labels[state.activeSection];
            ["chatList", "groupList", "storyList", "callList", "contactList"].forEach(id => $(id).classList.add("hidden"));
            const map = { chats: "chatList", groups: "groupList", stories: "storyList", calls: "callList", contacts: "contactList" };
            $(map[state.activeSection]).classList.remove("hidden");
        }

        function renderStories() {
            const storyList = $("storyList");
            storyList.innerHTML = "";

            if (!state.stories.length) {
                const empty = document.createElement("button");
                empty.className = "story-item";
                empty.onclick = createStory;
                empty.innerHTML = `<div class="avatar">+</div><div><strong class="chat-title">Durum ekle</strong><div class="last-message">24 saat görünür</div></div><span class="chat-time"></span>`;
                storyList.appendChild(empty);
                return;
            }

            state.stories.forEach(story => {
                const button = document.createElement("button");
                button.className = "story-item";
                button.onclick = () => showStory(story);

                const avatar = document.createElement("div");
                avatar.className = "avatar" + (story.user.online ? " online" : "");
                avatar.textContent = initials(story.user.displayName);

                const body = document.createElement("div");
                const title = document.createElement("strong");
                title.className = "chat-title";
                title.textContent = story.user.displayName;
                const meta = document.createElement("div");
                meta.className = "last-message";
                meta.textContent = story.body || "Durum paylaştı";
                body.append(title, meta);

                const time = document.createElement("span");
                time.className = "chat-time";
                time.textContent = relativeTime(story.createdAt);

                button.append(avatar, body, time);
                storyList.appendChild(button);
            });
        }

        function showStoryForUser(username) {
            const stories = state.stories.filter(story => story.username === username);
            if (!stories.length) {
                if (username === state.me.username) {
                    createStory();
                    return;
                }
                alert("Bu kullanıcının aktif durumu yok.");
                return;
            }

            showStory(stories[0]);
        }

        function showStory(story) {
            const expires = new Date(story.expiresAt).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
            $("storyTitle").textContent = `${story.user.displayName} (@${story.username})`;
            $("storyMeta").textContent = `${relativeTime(story.createdAt)} paylaşıldı • Bitiş: ${expires}`;
            const body = $("storyBody");
            body.innerHTML = "";
            if (story.body) {
                const text = document.createElement("p");
                text.textContent = story.body;
                body.appendChild(text);
            }
            if (story.attachment) {
                body.appendChild(renderStoryAttachment(story.attachment));
            }
            $("storyPanel").classList.remove("hidden");
        }

        function closeStoryPanel() {
            $("storyPanel").classList.add("hidden");
            $("storyBody").innerHTML = "";
        }

        function renderStoryAttachment(attachment) {
            if (attachment.type?.startsWith("video/")) {
                const video = document.createElement("video");
                video.className = "story-media";
                video.controls = true;
                video.playsInline = true;
                video.src = attachment.dataUrl;
                return video;
            }
            if (attachment.type?.startsWith("image/")) {
                const image = document.createElement("img");
                image.className = "story-media";
                image.src = attachment.dataUrl;
                image.alt = attachment.name || "Durum";
                return image;
            }
            const link = document.createElement("a");
            link.className = "file-pill";
            link.href = attachment.dataUrl;
            link.download = attachment.name || "durum";
            link.textContent = attachment.name || "Dosya";
            return link;
        }

        function renderChats() {
            const filter = $("searchInput").value.trim().toLowerCase();
            const chatList = $("chatList");
            chatList.innerHTML = "";

            if (state.generalGroup && !state.generalGroup.joined) {
                const button = document.createElement("button");
                button.className = "chat-item";
                button.onclick = () => joinGeneralGroup(true);

                const avatar = document.createElement("div");
                avatar.className = "avatar";
                avatar.textContent = "GG";

                const body = document.createElement("div");
                const title = document.createElement("strong");
                title.className = "chat-title";
                title.textContent = state.generalGroup.title || "Genel Grup";
                const last = document.createElement("div");
                last.className = "last-message";
                last.textContent = "Katılmak için tıkla";
                body.append(title, last);

                const count = document.createElement("span");
                count.className = "chat-time";
                count.textContent = `${state.generalGroup.members.length} kişi`;
                button.append(avatar, body, count);
                chatList.appendChild(button);
            }

            state.chats
                .filter(chat => chat.type !== "group")
                .filter(chat => chat.title.toLowerCase().includes(filter) || latestText(chat).toLowerCase().includes(filter))
                .forEach(chat => {
                    const button = document.createElement("button");
                    button.className = "chat-item" + (chat.id === state.activeChatId ? " active" : "");
                    button.onclick = () => {
                        state.activeChatId = chat.id;
                        socket.emit("message:read", { chatId: chat.id });
                        render();
                        openMobileChat();
                    };

                    const avatar = document.createElement("div");
                    avatar.className = "avatar" + (isChatOnline(chat) ? " online" : "");
                    avatar.textContent = initials(chat.title);
                    avatar.onclick = event => {
                        event.stopPropagation();
                        const other = chat.members.find(member => member.username !== state.me.username);
                        if (other) {
                            showStoryForUser(other.username);
                        }
                    };

                    const body = document.createElement("div");
                    const title = document.createElement("strong");
                    title.className = "chat-title";
                    title.textContent = chat.title;
                    const last = document.createElement("div");
                    last.className = "last-message";
                    last.textContent = latestText(chat);
                    body.append(title, last);

                    const time = document.createElement("span");
                    time.className = "chat-time";
                    time.textContent = chat.lastMessage ? formatTime(chat.lastMessage.createdAt) : "";

                    button.append(avatar, body, time);
                    chatList.appendChild(button);
                });
        }

        function renderGroups() {
            const filter = $("searchInput").value.trim().toLowerCase();
            const groupList = $("groupList");
            groupList.innerHTML = "";

            state.chats
                .filter(chat => chat.type === "group")
                .filter(chat => chat.title.toLowerCase().includes(filter) || latestText(chat).toLowerCase().includes(filter))
                .forEach(chat => {
                    const button = document.createElement("button");
                    button.className = "chat-item" + (chat.id === state.activeChatId ? " active" : "");
                    button.onclick = () => {
                        state.activeChatId = chat.id;
                        socket.emit("message:read", { chatId: chat.id });
                        render();
                        openMobileChat();
                    };

                    const avatar = document.createElement("div");
                    avatar.className = "avatar";
                    avatar.textContent = initials(chat.title);

                    const body = document.createElement("div");
                    const title = document.createElement("strong");
                    title.className = "chat-title";
                    title.textContent = chat.title;
                    const last = document.createElement("div");
                    last.className = "last-message";
                    last.textContent = latestText(chat) || `${chat.members.length} kişi`;
                    body.append(title, last);

                    const time = document.createElement("span");
                    time.className = "chat-time";
                    time.textContent = chat.lastMessage ? relativeTime(chat.lastMessage.createdAt) : "";

                    button.append(avatar, body, time);
                    groupList.appendChild(button);
                });
        }

        function renderCalls() {
            const filter = $("searchInput").value.trim().toLowerCase();
            const callList = $("callList");
            callList.innerHTML = "";

            if (!state.callLogs.length) {
                callList.innerHTML = `<button class="call-item"><div class="avatar">☎</div><div><strong class="chat-title">Arama kaydı yok</strong><div class="last-message">Sesli ve görüntülü aramalar burada görünür</div></div><span class="chat-time"></span></button>`;
                return;
            }

            state.callLogs
                .filter(log => log.chatTitle.toLowerCase().includes(filter) || log.callerName.toLowerCase().includes(filter))
                .forEach(log => {
                    const button = document.createElement("button");
                    button.className = "call-item";
                    button.onclick = () => {
                        state.activeChatId = log.chatId;
                        render();
                        openMobileChat();
                    };
                    const avatar = document.createElement("div");
                    avatar.className = "avatar";
                    avatar.textContent = log.kind === "video" ? "▣" : "☎";
                    const body = document.createElement("div");
                    const title = document.createElement("strong");
                    title.className = "chat-title";
                    title.textContent = log.chatTitle;
                    const meta = document.createElement("div");
                    meta.className = "last-message";
                    meta.textContent = `${log.kind === "video" ? "Görüntülü" : "Sesli"} • ${log.status === "active" ? "aktif arama" : formatDuration(log.durationSeconds)}`;
                    body.append(title, meta);
                    const time = document.createElement("span");
                    time.className = "chat-time";
                    time.textContent = relativeTime(log.startedAt);
                    button.append(avatar, body, time);
                    callList.appendChild(button);
                });
        }

        function renderContacts() {
            const filter = $("searchInput").value.trim().toLowerCase();
            const contactList = $("contactList");
            contactList.innerHTML = "";

            state.users
                .filter(user => user.username !== state.me.username)
                .filter(user => user.displayName.toLowerCase().includes(filter) || user.username.toLowerCase().includes(filter))
                .forEach(user => {
                    const button = document.createElement("button");
                    button.className = "contact-item";
                    button.onclick = () => socket.emit("chat:create", { target: user.username });

                    const avatar = document.createElement("div");
                    avatar.className = "avatar" + (user.online ? " online" : "");
                    avatar.textContent = initials(user.displayName);
                    avatar.onclick = event => {
                        event.stopPropagation();
                        showStoryForUser(user.username);
                    };

                    const body = document.createElement("div");
                    const title = document.createElement("strong");
                    title.className = "chat-title";
                    title.textContent = user.displayName;
                    const meta = document.createElement("div");
                    meta.className = "last-message";
                    meta.textContent = user.online ? "çevrimiçi" : "çevrimdışı";
                    body.append(title, meta);

                    const dot = document.createElement("span");
                    dot.className = "online-dot" + (user.online ? " online" : "");

                    button.append(avatar, body, dot);
                    contactList.appendChild(button);
                });
        }

        function renderActiveChat() {
            const chat = activeChat();
            const messageBox = $("messages");

            if (!chat) {
                messageBox.innerHTML = "";
                return;
            }

            $("activeTitle").textContent = chat.title;
            $("activeAvatar").textContent = initials(chat.title);
            $("activeAvatar").classList.toggle("online", isChatOnline(chat));
            $("activeStatus").textContent = statusText(chat);
            $("leaveGroupButton").classList.toggle("hidden", chat.type !== "group");
            const me = chat.members.find(member => member.username === state.me.username);
            $("groupMembersButton").classList.toggle("visible", chat.type === "group" && chat.id !== "lobby" && Boolean(me?.isAdmin));
            messageBox.innerHTML = "";

            chat.messages.forEach(message => {
                const mine = message.sender === state.me.username;
                const bubble = document.createElement("article");
                bubble.className = "bubble" + (mine ? " mine" : "");

                const sender = document.createElement("div");
                sender.className = "sender";
                sender.textContent = message.senderName;
                bubble.appendChild(sender);

                if (message.replyTo) {
                    const reply = document.createElement("div");
                    reply.className = "reply-context";
                    reply.textContent = `${message.replyTo.senderName}: ${message.replyTo.body || message.replyTo.attachmentName || "Mesaj"}`;
                    bubble.appendChild(reply);
                }

                if (message.body) {
                    const text = document.createElement("div");
                    text.textContent = message.body;
                    bubble.appendChild(text);
                }

                if (message.attachment) {
                    bubble.appendChild(renderAttachment(message.attachment));
                }

                const meta = document.createElement("div");
                meta.className = "message-meta";
                const read = chat.members.some(member => member.username !== state.me.username && message.readBy.includes(member.username));
                meta.innerHTML = `<button class="reply-action" type="button">Yanıtla</button><span>${formatTime(message.createdAt)}</span><span class="ticks ${read ? "read" : ""}">${mine ? (read ? "✓✓" : "✓") : ""}</span>`;
                meta.querySelector(".reply-action").onclick = event => {
                    event.stopPropagation();
                    setReplyTo(message);
                };
                bubble.appendChild(meta);
                let touchStartX = 0;
                bubble.addEventListener("touchstart", event => {
                    touchStartX = event.changedTouches[0].clientX;
                }, { passive: true });
                bubble.addEventListener("touchend", event => {
                    if (Math.abs(event.changedTouches[0].clientX - touchStartX) > 55) {
                        setReplyTo(message);
                    }
                }, { passive: true });
                messageBox.appendChild(bubble);
            });

            messageBox.scrollTop = messageBox.scrollHeight;
            socket.emit("message:read", { chatId: chat.id });
        }

        function renderAttachment(attachment) {
            if (attachment.type === "call") {
                const pill = document.createElement("div");
                pill.className = "file-pill";
                const label = attachment.kind === "video" ? "Görüntülü arama" : "Sesli arama";
                pill.textContent = attachment.status === "active"
                    ? `${label} aktif`
                    : `${label}: ${formatDuration(attachment.durationSeconds || 0)}`;
                return pill;
            }

            if (attachment.type && attachment.type.startsWith("audio/")) {
                const audio = document.createElement("audio");
                audio.className = "voice-message";
                audio.controls = true;
                audio.src = attachment.dataUrl;
                return audio;
            }

            if (attachment.type?.startsWith("video/")) {
                const video = document.createElement("video");
                video.className = "story-media";
                video.controls = true;
                video.playsInline = true;
                video.src = attachment.dataUrl;
                return video;
            }

            if (attachment.type && attachment.type.startsWith("image/")) {
                const image = document.createElement("img");
                image.src = attachment.dataUrl;
                image.alt = attachment.name;
                return image;
            }

            const link = document.createElement("a");
            link.className = "file-pill";
            link.href = attachment.dataUrl;
            link.download = attachment.name;
            link.textContent = `Dosya: ${attachment.name}`;
            return link;
        }

        function sendMessage() {
            const input = $("messageInput");
            const body = input.value.trim();
            const chat = activeChat();

            if (!chat || (!body && !state.attachment)) {
                return;
            }

            socket.emit("message:send", { chatId: chat.id, body, attachment: state.attachment, replyTo: state.replyTo });
            socket.emit("typing", { chatId: chat.id, typing: false });
            input.value = "";
            input.placeholder = "Mesaj";
            state.attachment = null;
            clearReply();
        }

        function setReplyTo(message) {
            state.replyTo = {
                id: message.id,
                senderName: message.senderName,
                body: message.body,
                attachmentName: message.attachment?.name
            };
            renderReplyPreview();
            $("messageInput").focus();
        }

        function clearReply() {
            state.replyTo = null;
            renderReplyPreview();
        }

        function renderReplyPreview() {
            const preview = $("replyPreview");
            $("replyPreview").classList.toggle("hidden", !state.replyTo);
            document.querySelector(".composer").classList.toggle("replying", Boolean(state.replyTo));
            if (!state.replyTo) {
                preview.innerHTML = "";
                return;
            }
            preview.innerHTML = `<span><strong>${state.replyTo.senderName}</strong>: ${state.replyTo.body || state.replyTo.attachmentName || "Mesaj"}</span><button class="reply-close" type="button">×</button>`;
            preview.querySelector("button").onclick = clearReply;
        }

        function createGroup() {
            const title = prompt("Grup adı");
            if (!title || title.trim().length < 2) {
                return;
            }

            const members = prompt("Gruba eklenecek kullanıcı adları, virgülle ayır. İstersen boş bırakıp sonra yönetici olarak ekleyebilirsin.") || "";

            socket.emit("chat:group:create", {
                title: title.trim(),
                members: members.split(",").map(item => item.trim().toLowerCase()).filter(Boolean)
            });
        }

        function createStory() {
            const body = prompt("24 saat görünecek durumunu yaz. Sadece resim/video paylaşmak için boş bırakabilirsin.") || "";
            if (confirm("Duruma resim veya video eklemek ister misin?")) {
                state.pendingStoryBody = body.trim();
                $("storyFileInput").value = "";
                $("storyFileInput").click();
                return;
            }
            if (!body.trim()) {
                return;
            }
            socket.emit("story:create", { body: body.trim() });
        }

        function maybePromptGeneralGroup() {
            if (!state.generalGroup || state.generalGroup.joined || state.generalPromptShown) {
                return;
            }

            state.generalPromptShown = true;
            setTimeout(() => joinGeneralGroup(true), 300);
        }

        function joinGeneralGroup(confirmFirst) {
            if (confirmFirst && !confirm("Genel Gruba katılmak ister misin?")) {
                return;
            }

            socket.emit("chat:lobby:join");
        }

        function leaveCurrentGroup() {
            const chat = activeChat();
            if (!chat || chat.type !== "group") {
                return;
            }

            if (!confirm(`${chat.title} grubundan çıkmak istiyor musun?`)) {
                return;
            }

            socket.emit("chat:leave", { chatId: chat.id });
        }

        function showActiveMembers() {
            const chat = activeChat();
            if (!chat || chat.type !== "group") {
                return;
            }

            const me = chat.members.find(member => member.username === state.me.username);
            const members = chat.members
                .map(member => `${member.online ? "çevrimiçi" : "çevrimdışı"} - ${member.displayName} (@${member.username})${member.isAdmin ? " - Yönetici" : ""}`)
                .join("\n");

            if (!me?.isAdmin || chat.id === "lobby") {
                alert(members || "Bu grupta kişi yok.");
                return;
            }

            const action = prompt(
                `${members || "Bu grupta kişi yok."}\n\nSen bu grubun yöneticisisin.\nÜye eklemek için +kullanıcıadı yaz.\nÜye çıkarmak için -kullanıcıadı yaz.`
            );

            if (!action) {
                return;
            }

            const trimmed = action.trim().toLowerCase();
            if (trimmed.startsWith("+")) {
                socket.emit("chat:group:add", { chatId: chat.id, username: trimmed.slice(1).trim() });
            } else if (trimmed.startsWith("-")) {
                socket.emit("chat:group:remove", { chatId: chat.id, username: trimmed.slice(1).trim() });
            }
        }

        async function toggleVoiceRecording() {
            if (state.recorder && state.recorder.state === "recording") {
                state.recorder.stop();
                $("voiceButton").classList.remove("recording");
                $("voiceButton").textContent = "●";
                stopVoiceWave();
                return;
            }

            if (!navigator.mediaDevices || !window.MediaRecorder) {
                alert("Bu tarayıcı sesli mesaj kaydını desteklemiyor.");
                return;
            }

            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (error) {
                alert("Mikrofon izni alınamadı.");
                return;
            }
            state.recordedChunks = [];
            state.recorder = new MediaRecorder(stream);
            startVoiceWave(stream);
            state.recorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    state.recordedChunks.push(event.data);
                }
            };
            state.recorder.onstop = () => {
                stream.getTracks().forEach(track => track.stop());
                stopVoiceWave();
                const blob = new Blob(state.recordedChunks, { type: "audio/webm" });
                const reader = new FileReader();
                reader.onload = () => {
                    state.attachment = {
                        name: `sesli-mesaj-${Date.now()}.webm`,
                        type: "audio/webm",
                        dataUrl: reader.result
                    };
                    $("messageInput").placeholder = "Sesli mesaj hazır";
                };
                reader.readAsDataURL(blob);
            };
            state.recorder.start();
            $("voiceButton").classList.add("recording");
            $("voiceButton").textContent = "■";
        }

        async function deleteAccount() {
            const password = prompt("Hesabını silmek için şifreni yaz.");
            if (!password) {
                return;
            }

            if (!confirm("Hesabın ve sana ait mesajlar silinecek. Devam edilsin mi?")) {
                return;
            }

            const response = await fetch(`/account/${state.me.username}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password })
            });
            const data = await response.json();

            if (!data.ok) {
                alert(data.message);
                return;
            }

            localStorage.removeItem("nexalineUser");
            location.reload();
        }

        function activeChat() {
            return state.chats.find(chat => chat.id === state.activeChatId) || state.chats[0];
        }

        function upsertChat(chat) {
            const index = state.chats.findIndex(item => item.id === chat.id);
            if (index >= 0) {
                state.chats[index] = { ...state.chats[index], ...chat };
            } else {
                state.chats.unshift(chat);
            }
        }

        function latestText(chat) {
            const message = chat.lastMessage || chat.messages[chat.messages.length - 1];
            if (!message) {
                return "";
            }

            return message.body || message.attachment?.name || "Dosya";
        }

        function isChatOnline(chat) {
            return chat.type === "direct" && chat.members.some(member => member.username !== state.me.username && member.online);
        }

        function statusText(chat) {
            const typing = (state.typing[chat.id] || []).filter(username => username !== state.me.username);
            if (typing.length) {
                return "yazıyor...";
            }

            if (chat.type === "group") {
                const me = chat.members.find(member => member.username === state.me.username);
                return `${chat.members.length || state.users.length} kişi${me?.isAdmin ? " • Yönetici" : ""}`;
            }

            return isChatOnline(chat) ? "çevrimiçi" : "çevrimdışı";
        }

        function initials(text) {
            return text
                .split(/\s+/)
                .filter(Boolean)
                .slice(0, 2)
                .map(part => part[0])
                .join("")
                .toUpperCase() || "NL";
        }

        function formatTime(value) {
            return new Date(value).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
        }

        function relativeTime(value) {
            const seconds = Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 1000));
            if (seconds < 60) {
                return `${seconds || 1} sn önce`;
            }
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) {
                return `${minutes} dk önce`;
            }
            const hours = Math.floor(minutes / 60);
            if (hours < 24) {
                return `${hours} saat önce`;
            }
            const days = Math.floor(hours / 24);
            return `${days} gün önce`;
        }

        function formatDuration(seconds) {
            seconds = Math.max(0, Number(seconds) || 0);
            const minutes = Math.floor(seconds / 60);
            const remaining = seconds % 60;
            return minutes ? `${minutes} dk ${remaining} sn` : `${remaining} sn`;
        }

        function startVoiceWave(stream) {
            const wave = $("voiceWave");
            wave.innerHTML = Array.from({ length: 28 }, () => "<span></span>").join("");
            wave.classList.add("active");
            const bars = [...wave.querySelectorAll("span")];
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 64;
            audioContext.createMediaStreamSource(stream).connect(analyser);
            const data = new Uint8Array(analyser.frequencyBinCount);
            state.waveTimer = setInterval(() => {
                analyser.getByteFrequencyData(data);
                bars.forEach((bar, index) => {
                    const value = data[index % data.length] || 8;
                    bar.style.height = `${8 + Math.round((value / 255) * 25)}px`;
                });
            }, 80);
            wave.dataset.audioContext = "active";
            wave._audioContext = audioContext;
        }

        function stopVoiceWave() {
            if (state.waveTimer) {
                clearInterval(state.waveTimer);
                state.waveTimer = null;
            }
            if ($("voiceWave")._audioContext) {
                $("voiceWave")._audioContext.close();
                $("voiceWave")._audioContext = null;
            }
            $("voiceWave").classList.remove("active");
        }

        function playTone(frequency, duration) {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                oscillator.frequency.value = frequency;
                oscillator.connect(gain);
                gain.connect(context.destination);
                gain.gain.setValueAtTime(0.001, context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.08, context.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + duration);
                oscillator.start();
                oscillator.stop(context.currentTime + duration);
            } catch (error) {
                // Ses izni olmayan tarayıcılarda sessiz geç.
            }
        }

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) {
                return;
            }

            if (file.size > 5_000_000) {
                alert("Dosya boyutu 5 MB altında olmalı.");
                event.target.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                state.attachment = {
                    name: file.name,
                    type: file.type || "application/octet-stream",
                    dataUrl: reader.result
                };
                $("messageInput").placeholder = file.name;
            };
            reader.readAsDataURL(file);
        }

        function handleStoryFile(event) {
            const file = event.target.files[0];
            const body = state.pendingStoryBody || "";
            state.pendingStoryBody = "";
            if (!file) {
                if (body) {
                    socket.emit("story:create", { body });
                }
                return;
            }
            if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) {
                alert("Durum için sadece resim veya video seçebilirsin.");
                return;
            }
            if (file.size > 2500000) {
                alert("Durum dosyası 2.5 MB altında olmalı.");
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                socket.emit("story:create", {
                    body,
                    attachment: {
                        name: file.name,
                        type: file.type,
                        dataUrl: reader.result
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        function ensureCallChat() {
            const chat = activeChat();
            if (!chat) {
                alert("Önce bir sohbet seçmelisin.");
                return null;
            }

            return chat;
        }

        async function getCallStream(audioOnly) {
            if (!navigator.mediaDevices?.getUserMedia) {
                throw new Error("Tarayıcı kamera/mikrofonu sadece HTTPS, localhost veya izin verilmiş güvenli adreslerde açar.");
            }
            return navigator.mediaDevices.getUserMedia({ audio: true, video: !audioOnly });
        }

        async function ensureLocalCallStream(audioOnly) {
            if (!state.call.localStream) {
                state.call.localStream = await getCallStream(audioOnly);
                $("localVideo").srcObject = state.call.localStream;
                $("localVideo").classList.toggle("hidden", audioOnly);
            }
            if (!state.call.remoteStream) {
                state.call.remoteStream = new MediaStream();
                $("remoteVideo").srcObject = state.call.remoteStream;
            }
            return state.call.localStream;
        }

        async function createPeer(peerUsername, chatId, audioOnly) {
            if (state.call.peers[peerUsername]) {
                return state.call.peers[peerUsername];
            }
            const pc = new RTCPeerConnection(rtcConfig);
            const localStream = await ensureLocalCallStream(audioOnly);

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit("call:ice", { chatId, to: peerUsername, candidate: event.candidate });
                }
            };
            pc.ontrack = event => {
                const stream = event.streams[0];
                if (stream) {
                    stream.getTracks().forEach(track => {
                        if (!state.call.remoteStream.getTracks().some(existing => existing.id === track.id)) {
                            state.call.remoteStream.addTrack(track);
                        }
                    });
                }
                $("remoteVideo").srcObject = state.call.remoteStream;
            };
            pc.onconnectionstatechange = () => {
                $("callStatus").textContent = pc.connectionState === "connected" ? "bağlandı" : $("callStatus").textContent;
            };

            state.call.peers[peerUsername] = pc;
            state.call.chatId = chatId;
            state.call.audioOnly = audioOnly;
            return pc;
        }

        async function flushPendingIce(peerUsername) {
            const pc = state.call.peers[peerUsername];
            const pending = state.call.pendingIce[peerUsername] || [];
            if (!pc || !pc.remoteDescription) {
                return;
            }
            for (const candidate of pending) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (error) {
                    console.warn("ICE adayı eklenemedi", error);
                }
            }
            state.call.pendingIce[peerUsername] = [];
        }

        async function startCall(audioOnly) {
            const chat = ensureCallChat();
            if (!chat || Object.keys(state.call.peers).length) {
                return;
            }

            openCallPanel(audioOnly ? "Sesli arama" : "Görüntülü arama", "aranıyor", false, audioOnly);
            playTone(audioOnly ? 520 : 680, 0.18);
            try {
                await ensureLocalCallStream(audioOnly);
            } catch (error) {
                alert(error.message || "Mikrofon veya kamera izni alınamadı.");
                endCall(false);
                return;
            }
            state.call.startedAt = Date.now();
            socket.emit("call:log", { chatId: chat.id, kind: audioOnly ? "audio" : "video", status: "active" });
            const peers = chat.members.filter(member => member.username !== state.me.username);
            if (!peers.length) {
                alert("Aranacak kişi yok.");
                endCall(false);
                return;
            }
            for (const member of peers) {
                const pc = await createPeer(member.username, chat.id, audioOnly);
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit("call:offer", { chatId: chat.id, to: member.username, offer, audioOnly });
            }
        }

        function openCallPanel(title, status, incoming, audioOnly) {
            $("callTitle").textContent = title;
            $("callStatus").textContent = status;
            $("acceptCallButton").classList.toggle("hidden", !incoming);
            $("cameraButton").classList.toggle("hidden", audioOnly);
            $("callPanel").classList.remove("hidden");
        }

        async function acceptCall() {
            const incoming = state.call.incomingOffer;
            if (!incoming) {
                return;
            }

            openCallPanel(incoming.audioOnly ? "Sesli arama" : "Görüntülü arama", "bağlanıyor", false, incoming.audioOnly);
            let pc;
            try {
                pc = await createPeer(incoming.from, incoming.chatId, incoming.audioOnly);
            } catch (error) {
                alert(error.message || "Mikrofon veya kamera izni alınamadı.");
                endCall(true);
                return;
            }
            await pc.setRemoteDescription(new RTCSessionDescription(incoming.offer));
            await flushPendingIce(incoming.from);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit("call:answer", { chatId: incoming.chatId, to: incoming.from, answer });
            state.call.startedAt = Date.now();
            state.call.incomingOffer = null;
        }

        async function handleRemoteAnswer(data) {
            const pc = state.call.peers[data.from];
            if (pc && data.answer) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                await flushPendingIce(data.from);
                $("callStatus").textContent = "bağlandı";
            }
        }

        async function handleRemoteIce(data) {
            if (!data.candidate || !data.from) {
                return;
            }
            const pc = state.call.peers[data.from];
            if (!pc || !pc.remoteDescription) {
                state.call.pendingIce[data.from] = state.call.pendingIce[data.from] || [];
                state.call.pendingIce[data.from].push(data.candidate);
                return;
            }
            try {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            } catch (error) {
                console.warn("ICE adayı eklenemedi", error);
            }
        }

        function endCall(notify = true) {
            const durationSeconds = state.call.startedAt ? Math.max(1, Math.round((Date.now() - state.call.startedAt) / 1000)) : 0;
            if (notify && state.call.chatId) {
                socket.emit("call:end", { chatId: state.call.chatId });
                socket.emit("call:log", {
                    chatId: state.call.chatId,
                    kind: state.call.audioOnly ? "audio" : "video",
                    status: "ended",
                    durationSeconds
                });
            }

            Object.values(state.call.peers).forEach(pc => pc.close());
            if (state.call.localStream) {
                state.call.localStream.getTracks().forEach(track => track.stop());
            }

            state.call = { peers: {}, pendingIce: {}, localStream: null, remoteStream: null, chatId: null, audioOnly: false, incomingOffer: null, startedAt: null };
            $("localVideo").srcObject = null;
            $("remoteVideo").srcObject = null;
            $("callPanel").classList.add("hidden");
        }

        function toggleMute() {
            if (!state.call.localStream) {
                return;
            }

            state.call.localStream.getAudioTracks().forEach(track => {
                track.enabled = !track.enabled;
                $("muteButton").textContent = track.enabled ? "♫" : "×";
            });
        }

        function toggleCamera() {
            if (!state.call.localStream) {
                return;
            }

            state.call.localStream.getVideoTracks().forEach(track => {
                track.enabled = !track.enabled;
                $("cameraButton").textContent = track.enabled ? "▣" : "□";
            });
        }

        $("loginTab").onclick = () => setAuthMode("login");
        $("registerTab").onclick = () => setAuthMode("register");
        $("authButton").onclick = submitAuth;
        $("sendButton").onclick = sendMessage;
        $("searchInput").oninput = () => {
            renderChats();
            renderGroups();
            renderCalls();
            renderContacts();
        };
        document.querySelectorAll(".nav-tab").forEach(tab => {
            tab.onclick = () => {
                state.activeSection = tab.dataset.section;
                renderSections();
            };
        });
        $("attachButton").onclick = () => $("fileInput").click();
        $("fileInput").onchange = handleFile;
        $("storyFileInput").onchange = handleStoryFile;
        $("closeStoryButton").onclick = closeStoryPanel;
        $("voiceButton").onclick = toggleVoiceRecording;
        $("deleteAccountButton").onclick = deleteAccount;
        $("storyButton").onclick = createStory;
        $("logoutButton").onclick = () => {
            localStorage.removeItem("nexalineUser");
            location.reload();
        };
        $("newGroupButton").onclick = createGroup;
        $("backButton").onclick = closeMobileChat;
        $("leaveGroupButton").onclick = leaveCurrentGroup;
        $("groupMembersButton").onclick = showActiveMembers;
        $("activeStatus").onclick = showActiveMembers;
        $("callButton").onclick = () => startCall(true);
        $("videoButton").onclick = () => startCall(false);
        $("acceptCallButton").onclick = acceptCall;
        $("endCallButton").onclick = () => endCall(true);
        $("muteButton").onclick = toggleMute;
        $("cameraButton").onclick = toggleCamera;
        $("messageInput").addEventListener("input", () => {
            const chat = activeChat();
            if (chat) {
                socket.emit("typing", { chatId: chat.id, typing: $("messageInput").value.length > 0 });
            }
        });
        $("messageInput").addEventListener("keydown", event => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        socket.on("app:state", data => {
            state.me = data.user;
            state.users = data.users;
            state.chats = data.chats;
            state.generalGroup = data.generalGroup;
            state.stories = data.stories || [];
            state.callLogs = data.callLogs || [];
            state.activeChatId = state.activeChatId || state.chats[0]?.id || "lobby";
            render();
            maybePromptGeneralGroup();
        });

        socket.on("presence:update", users => {
            state.users = users;
            state.chats = state.chats.map(chat => ({
                ...chat,
                members: chat.members.map(member => users.find(user => user.username === member.username) || member)
            }));
            render();
        });

        socket.on("chat:upsert", chat => {
            upsertChat(chat);
            state.activeChatId = chat.id;
            render();
            openMobileChat();
        });

        socket.on("chat:remove", data => {
            state.chats = state.chats.filter(chat => chat.id !== data.chatId);
            state.activeChatId = state.chats[0]?.id || null;
            render();
            closeMobileChat();
        });

        socket.on("general:update", data => {
            state.generalGroup = data;
            const lobby = state.chats.find(chat => chat.id === data.id);
            if (lobby) {
                lobby.title = data.title;
                lobby.members = data.members;
            }
            render();
        });

        socket.on("stories:update", stories => {
            state.stories = stories;
            renderStories();
        });

        socket.on("calls:update", callLogs => {
            state.callLogs = callLogs || [];
            renderCalls();
        });

        socket.on("account:deleted", () => {
            localStorage.removeItem("nexalineUser");
            location.reload();
        });

        socket.on("admin:reset", () => {
            localStorage.removeItem("nexalineUser");
            location.reload();
        });

        socket.on("message:new", message => {
            const chat = state.chats.find(item => item.id === message.chatId);
            if (!chat) {
                loadBootstrap();
                return;
            }

            chat.messages.push(message);
            chat.lastMessage = message;
            state.chats = [chat, ...state.chats.filter(item => item.id !== chat.id)];
            render();
        });

        socket.on("typing:update", data => {
            state.typing[data.chatId] = data.users;
            renderActiveChat();
        });

        socket.on("message:read", data => {
            const chat = state.chats.find(item => item.id === data.chatId);
            if (!chat) {
                return;
            }

            chat.messages.forEach(message => {
                if (data.messageIds.includes(message.id) && !message.readBy.includes(data.reader)) {
                    message.readBy.push(data.reader);
                }
            });
            renderActiveChat();
        });

        socket.on("notice", data => alert(data.message));
        socket.on("call:offer", data => {
            if (Object.keys(state.call.peers).length || state.call.incomingOffer) {
                socket.emit("call:end", { chatId: data.chatId, to: data.from });
                return;
            }

            state.call.incomingOffer = data;
            playTone(data.audioOnly ? 420 : 760, 0.25);
            openCallPanel(`${data.fromName} arıyor`, data.audioOnly ? "sesli arama" : "görüntülü arama", true, data.audioOnly);
        });
        socket.on("call:answer", handleRemoteAnswer);
        socket.on("call:ice", handleRemoteIce);
        socket.on("call:end", () => endCall(false));

        const rememberedUser = localStorage.getItem("nexalineUser");
        if (rememberedUser) {
            state.me = { username: rememberedUser };
            openApp();
        }

        window.addEventListener("resize", () => {
            if (!isMobileView()) {
                closeMobileChat();
            }
        });
    </script>
</body>
</html>
