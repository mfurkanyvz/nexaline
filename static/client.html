        function handleStoryFile(event) {
            const file = event.target.files[0];
            const body = state.pendingStoryBody || "";
            state.pendingStoryBody = "";
            if (!file) {
                if (body) {
                    socket.emit("story:create", { body });
                }
                return;
            }
            if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) {
                showToast("Durum için sadece resim veya video seçebilirsin.");
                return;
            }
            if (file.size > 2500000) {
                showToast("Durum dosyası 2.5 MB altında olmalı.");
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                socket.emit("story:create", {
                    body,
                    attachment: {
                        name: file.name,
                        type: file.type,
                        dataUrl: reader.result
                    }
                });
            };
            reader.readAsDataURL(file);
        }

            if (!navigator.mediaDevices?.getUserMedia) {
                throw new Error("Tarayıcı kamera/mikrofonu sadece HTTPS, localhost veya izin verilmiş güvenli adreslerde açar.");
            }
            return navigator.mediaDevices.getUserMedia({
                audio: true,
                video: audioOnly ? false : { facingMode: state.call.cameraFacing || "user" }
            });
        }

        async function ensureLocalCallStream(audioOnly) {
            if (!state.call.localStream) {
                state.call.localStream = await getCallStream(audioOnly);
                $("localVideo").srcObject = state.call.localStream;
                $("localVideo").classList.toggle("hidden", audioOnly);
            }
            if (!state.call.remoteStream) {
                state.call.remoteStream = new MediaStream();
                $("remoteVideo").srcObject = state.call.remoteStream;
            }
            return state.call.localStream;
        }

        async function createPeer(peerUsername, chatId, audioOnly) {
            if (state.call.peers[peerUsername]) {
                return state.call.peers[peerUsername];
            }
            const pc = new RTCPeerConnection(rtcConfig);
            const localStream = await ensureLocalCallStream(audioOnly);

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit("call:ice", { chatId, to: peerUsername, candidate: event.candidate });
                }
            };
            pc.ontrack = event => {
                const stream = event.streams[0];
                if (stream) {
                    stream.getTracks().forEach(track => {
                        if (!state.call.remoteStream.getTracks().some(existing => existing.id === track.id)) {
                            state.call.remoteStream.addTrack(track);
                        }
                    });
                }
                $("remoteVideo").srcObject = state.call.remoteStream;
            };
            pc.onconnectionstatechange = () => {
                $("callStatus").textContent = pc.connectionState === "connected" ? "bağlandı" : $("callStatus").textContent;
            };

            state.call.peers[peerUsername] = pc;
            state.call.chatId = chatId;
            state.call.audioOnly = audioOnly;
            return pc;
        }

        async function flushPendingIce(peerUsername) {
            const pc = state.call.peers[peerUsername];
            const pending = state.call.pendingIce[peerUsername] || [];
            if (!pc || !pc.remoteDescription) {
                return;
            }
            for (const candidate of pending) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (error) {
                    console.warn("ICE adayı eklenemedi", error);
                }
            }
            state.call.pendingIce[peerUsername] = [];
        }

        async function startCall(audioOnly) {
            const chat = ensureCallChat();
            if (!chat || Object.keys(state.call.peers).length) {
                return;
            }

            openCallPanel(audioOnly ? "Sesli arama" : "Görüntülü arama", "aranıyor", false, audioOnly);
            playCallSound();
            try {
                await ensureLocalCallStream(audioOnly);
            } catch (error) {
                showToast(error.message || "Mikrofon veya kamera izni alınamadı.");
                endCall(false);
                return;
            }
            state.call.startedAt = Date.now();
            socket.emit("call:log", { chatId: chat.id, kind: audioOnly ? "audio" : "video", status: "active" });
            const peers = chat.members.filter(member => member.username !== state.me.username);
            if (!peers.length) {
                showToast("Aranacak kişi yok.");
                endCall(false);
                return;
            }
            for (const member of peers) {
                const pc = await createPeer(member.username, chat.id, audioOnly);
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit("call:offer", { chatId: chat.id, to: member.username, offer, audioOnly });
            }
        }

        function openCallPanel(title, status, incoming, audioOnly) {
            $("callTitle").textContent = title;
            $("callStatus").textContent = status;
            $("acceptCallButton").classList.toggle("hidden", !incoming);
            $("cameraButton").classList.toggle("hidden", audioOnly);
            $("switchCameraButton").classList.toggle("hidden", audioOnly);
            $("callPanel").classList.remove("hidden");
        }

        async function acceptCall() {
            const incoming = state.call.incomingOffer;
            if (!incoming) {
                return;
            }

            stopCallRingtone();
            openCallPanel(incoming.audioOnly ? "Sesli arama" : "Görüntülü arama", "bağlanıyor", false, incoming.audioOnly);
            let pc;
            try {
                pc = await createPeer(incoming.from, incoming.chatId, incoming.audioOnly);
            } catch (error) {
                showToast(error.message || "Mikrofon veya kamera izni alınamadı.");
                endCall(true);
                return;
            }
            await pc.setRemoteDescription(new RTCSessionDescription(incoming.offer));
            await flushPendingIce(incoming.from);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit("call:answer", { chatId: incoming.chatId, to: incoming.from, answer });
            state.call.startedAt = Date.now();
            state.call.incomingOffer = null;
        }

        async function handleRemoteAnswer(data) {
            const pc = state.call.peers[data.from];
            if (pc && data.answer) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                await flushPendingIce(data.from);
                $("callStatus").textContent = "bağlandı";
            }
        }

        async function handleRemoteIce(data) {
            if (!data.candidate || !data.from) {
                return;
            }
            const pc = state.call.peers[data.from];
            if (!pc || !pc.remoteDescription) {
                state.call.pendingIce[data.from] = state.call.pendingIce[data.from] || [];
                state.call.pendingIce[data.from].push(data.candidate);
                return;
            }
            try {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            } catch (error) {
                console.warn("ICE adayı eklenemedi", error);
            }
        }

        function endCall(notify = true) {
            stopCallRingtone();
            const durationSeconds = state.call.startedAt ? Math.max(1, Math.round((Date.now() - state.call.startedAt) / 1000)) : 0;
            if (notify && state.call.chatId) {
                socket.emit("call:end", { chatId: state.call.chatId });
                socket.emit("call:log", {
                    chatId: state.call.chatId,
                    kind: state.call.audioOnly ? "audio" : "video",
                    status: "ended",
                    durationSeconds
                });
            }

            Object.values(state.call.peers).forEach(pc => pc.close());
            if (state.call.localStream) {
                state.call.localStream.getTracks().forEach(track => track.stop());
            }

            state.call = { peers: {}, pendingIce: {}, localStream: null, remoteStream: null, chatId: null, audioOnly: false, incomingOffer: null, startedAt: null, ringtoneTimer: null, cameraFacing: "user" };
            $("localVideo").srcObject = null;
            $("remoteVideo").srcObject = null;
            $("callPanel").classList.add("hidden");
        }

        function toggleMute() {
            if (!state.call.localStream) {
                return;
            }

            state.call.localStream.getAudioTracks().forEach(track => {
                track.enabled = !track.enabled;
                $("muteButton").textContent = track.enabled ? "♫" : "×";
            });
        }

        function toggleCamera() {
            if (!state.call.localStream) {
                return;
            }

            state.call.localStream.getVideoTracks().forEach(track => {
                track.enabled = !track.enabled;
                $("cameraButton").textContent = track.enabled ? "▣" : "□";
            });
        }

        async function switchCamera() {
            if (!state.call.localStream || state.call.audioOnly) {
                return;
            }
            state.call.cameraFacing = state.call.cameraFacing === "user" ? "environment" : "user";
            try {
                const nextStream = await getCallStream(false);
                const nextVideoTrack = nextStream.getVideoTracks()[0];
                if (!nextVideoTrack) {
                    return;
                }
                const oldVideoTracks = state.call.localStream.getVideoTracks();
                oldVideoTracks.forEach(track => {
                    state.call.localStream.removeTrack(track);
                    track.stop();
                });
                state.call.localStream.addTrack(nextVideoTrack);
                $("localVideo").srcObject = state.call.localStream;
                Object.values(state.call.peers).forEach(pc => {
                    const sender = pc.getSenders().find(item => item.track?.kind === "video");
                    sender?.replaceTrack(nextVideoTrack);
                });
                nextStream.getAudioTracks().forEach(track => track.stop());
            } catch (error) {
                showToast("Kamera değiştirilemedi.");
            }
        }

        $("loginTab").onclick = () => setAuthMode("login");
        $("registerTab").onclick = () => setAuthMode("register");
        $("authBackButton").onclick = goBackAuthStep;
        $("authButton").onclick = submitAuth;
        ["username", "email", "verificationCode", "password", "confirmPassword"].forEach(id => {
            $(id).addEventListener("keydown", event => {
                if (event.key === "Enter") {
                    event.preventDefault();
                    submitAuth();
                }
            });
        });
        $("sendButton").onclick = sendMessage;
        $("searchInput").oninput = () => {
            renderChats();
            renderGroups();
            renderCalls();
            renderContacts();
        };
        document.querySelectorAll(".nav-tab").forEach(tab => {
            tab.onclick = () => {
                state.activeSection = tab.dataset.section;
                renderSections();
            };
        });
        $("attachButton").onclick = () => $("fileInput").click();
        $("emojiButton").onclick = toggleEmojiPanel;
        $("locationButton").onclick = sendCurrentLocation;
        $("fileInput").onchange = handleFile;
        $("storyFileInput").onchange = handleStoryFile;
        $("closeStoryButton").onclick = closeStoryPanel;
        $("voiceButton").onclick = toggleVoiceRecording;
        $("cancelVoiceButton").onclick = cancelVoiceRecording;
        $("settingsButton").onclick = openSettings;
        $("closeSettingsButton").onclick = closeSettings;
        $("profileImageButton").onclick = chooseProfileImage;
        $("removeProfileImageButton").onclick = () => {
            state.profileImageDraft = "";
            setAvatar($("settingsAvatar"), { displayName: $("displayNameInput").value || state.me.displayName }, state.me.displayName);
        };
        $("profileImageInput").onchange = handleProfileImage;
        $("saveProfileButton").onclick = saveProfile;
        $("changeEmailButton").onclick = changeAccountEmail;
        $("changePasswordButton").onclick = changeAccountPassword;
        $("settingsDeleteButton").onclick = deleteAccount;
        $("settingsLogoutButton").onclick = logout;
        $("forgotButton").onclick = forgotPassword;
        $("storyButton").onclick = createStory;
        $("newGroupButton").onclick = createGroup;
        $("backButton").onclick = closeMobileChat;
        $("leaveGroupButton").onclick = leaveCurrentGroup;
        $("groupMembersButton").onclick = showActiveMembers;
        $("activeStatus").onclick = showActiveMembers;
        $("callButton").onclick = () => startCall(true);
        $("videoButton").onclick = () => startCall(false);
        $("acceptCallButton").onclick = acceptCall;
        $("endCallButton").onclick = () => endCall(true);
        $("muteButton").onclick = toggleMute;
        $("cameraButton").onclick = toggleCamera;
        $("switchCameraButton").onclick = switchCamera;
        $("modalCloseButton").onclick = closeModal;
        $("messageInput").addEventListener("input", () => {
            const chat = activeChat();
            if (chat) {
                socket.emit("typing", { chatId: chat.id, typing: $("messageInput").value.length > 0 });
            }
        });
        $("messageInput").addEventListener("keydown", event => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        socket.on("app:state", data => {
            state.me = data.user;
            state.users = data.users;
            state.chats = data.chats;
            state.generalGroup = data.generalGroup;
            state.stories = data.stories || [];
            state.callLogs = data.callLogs || [];
            hydrateRealtimeState(data);
            state.activeChatId = state.activeChatId || state.chats[0]?.id || "lobby";
            render();
            maybePromptGeneralGroup();
        });

        socket.on("presence:update", users => {
            state.users = users;
            state.chats = state.chats.map(chat => ({
                ...chat,
                members: chat.members.map(member => users.find(user => user.username === member.username) || member)
            }));
            render();
        });

        socket.on("chat:upsert", chat => {
            upsertChat(chat);
            state.activeChatId = chat.id;
            render();
            openMobileChat();
        });

        socket.on("chat:remove", data => {
            state.chats = state.chats.filter(chat => chat.id !== data.chatId);
            state.activeChatId = state.chats[0]?.id || null;
            render();
            closeMobileChat();
        });

        socket.on("general:update", data => {
            state.generalGroup = data;
            const lobby = state.chats.find(chat => chat.id === data.id);
            if (lobby) {
                lobby.title = data.title;
                lobby.members = data.members;
            }
            render();
        });

        socket.on("stories:update", stories => {
            state.stories = stories;
            renderStories();
        });

        socket.on("calls:update", callLogs => {
            state.callLogs = callLogs || [];
            renderCalls();
        });

        socket.on("social:update", data => {
            hydrateRealtimeState(data);
            renderSections();
            renderGroups();
            renderContacts();
        });

        socket.on("account:deleted", () => {
            localStorage.removeItem("nexalineUser");
            location.reload();
        });

        socket.on("admin:reset", () => {
            localStorage.removeItem("nexalineUser");
            location.reload();
        });

        socket.on("message:new", message => {
            const chat = state.chats.find(item => item.id === message.chatId);
            if (!chat) {
                loadBootstrap();
                return;
            }

            if (message.sender !== state.me.username) {
                playMessageSound();
            }
            chat.messages.push(message);
            chat.lastMessage = message;
            state.chats = [chat, ...state.chats.filter(item => item.id !== chat.id)];
            render();
        });

        socket.on("typing:update", data => {
            state.typing[data.chatId] = data.users;
            renderActiveChat();
        });

        socket.on("message:read", data => {
            const chat = state.chats.find(item => item.id === data.chatId);
            if (!chat) {
                return;
            }

            chat.messages.forEach(message => {
                if (data.messageIds.includes(message.id) && !message.readBy.includes(data.reader)) {
                    message.readBy.push(data.reader);
                }
            });
            renderActiveChat();
        });

        socket.on("message:deleted", message => {
            const chat = state.chats.find(item => item.id === message.chatId);
            if (!chat) {
                return;
            }
            const index = chat.messages.findIndex(item => item.id === message.id);
            if (index >= 0) {
                chat.messages[index] = message;
            }
            if (chat.lastMessage?.id === message.id) {
                chat.lastMessage = message;
            }
            render();
        });

        socket.on("message:remove-local", data => {
            const chat = state.chats.find(item => item.id === data.chatId);
            if (!chat) {
                return;
            }
            chat.messages = chat.messages.filter(message => message.id !== data.messageId);
            chat.lastMessage = chat.messages[chat.messages.length - 1] || null;
            render();
        });

        socket.on("message:reaction", data => {
            const chat = state.chats.find(item => item.id === data.chatId);
            if (!chat) {
                return;
            }
            const message = chat.messages.find(item => item.id === data.messageId);
            if (message) {
                message.reactions = data.reactions || {};
                renderActiveChat();
            }
        });

        socket.on("notice", data => showToast(data.message));
        socket.on("call:offer", data => {
            if (Object.keys(state.call.peers).length || state.call.incomingOffer) {
                socket.emit("call:end", { chatId: data.chatId, to: data.from });
                return;
            }

            state.call.incomingOffer = data;
            startCallRingtone();
            openCallPanel(`${data.fromName} arıyor`, data.audioOnly ? "sesli arama" : "görüntülü arama", true, data.audioOnly);
        });
        socket.on("call:answer", handleRemoteAnswer);
        socket.on("call:ice", handleRemoteIce);
        socket.on("call:end", () => endCall(false));

        const rememberedUser = localStorage.getItem("nexalineUser");
        if (rememberedUser) {
            state.me = { username: rememberedUser };
            openApp();
        }

        window.addEventListener("resize", () => {
            if (!isMobileView()) {
                closeMobileChat();
            }
        });
    </script>
</body>
</html>
