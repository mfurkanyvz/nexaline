<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NexaLine Admin">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NexaLine Admin</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon-192-3d.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-3d.png">
    <style>
        :root {
            --bg: #10131b;
            --panel: #171b25;
            --panel-2: #202631;
            --line: #323946;
            --text: #eef1f6;
            --muted: #8b95a6;
            --red: #d83b4b;
            --blue: #3577d9;
            --green: #28c76f;
            --yellow: #d7b35a;
        }

        * { box-sizing: border-box; min-width: 0; }
        body {
            margin: 0;
            max-width: 100vw;
            overflow-x: hidden;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
        }

        button, input { font: inherit; }
        button {
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            color: #fff;
            background: var(--panel-2);
            min-height: 38px;
            padding: 9px 12px;
            line-height: 1.15;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        input, textarea, p, small, strong, h1, h2, h3, .message, .card, .chip {
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .shell {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            min-height: 100vh;
            max-width: 100vw;
        }

        .side {
            padding: 18px;
            border-right: 1px solid var(--line);
            background: var(--panel);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .brand img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        h1, h2, h3, p { margin-top: 0; }
        h1 { font-size: 24px; }
        h2 { font-size: 20px; }
        h3 { font-size: 15px; }
        p, small { color: var(--muted); }
        h1, h2, h3 { line-height: 1.2; }

        .token-box {
            display: grid;
            gap: 8px;
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 7px;
            outline: none;
            color: var(--text);
            background: #090d15;
        }

        .primary { background: linear-gradient(135deg, var(--red), #b3263b); }
        .danger { background: var(--red); }
        .ok { background: var(--green); color: #06100a; }

        .tabs {
            display: grid;
            gap: 8px;
        }

        .tab {
            padding: 11px 12px;
            text-align: left;
        }

        .tab.active {
            background: var(--red);
            box-shadow: 0 0 18px rgba(226, 58, 79, 0.22);
        }

        .content {
            min-width: 0;
            padding: 18px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 10px;
            margin-bottom: 16px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .metric {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .metric strong {
            display: block;
            margin-bottom: 3px;
            font-size: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }

        .card {
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .list {
            display: grid;
            gap: 10px;
        }

        .message {
            padding: 10px;
            border-left: 3px solid var(--blue);
            border-radius: 7px;
            background: var(--panel-2);
        }

        .message.deleted-message {
            border-left-color: var(--yellow);
            opacity: 0.82;
        }

        .conversation-view {
            display: grid;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background:
                radial-gradient(circle at 16% 12%, rgba(226, 58, 79, 0.10), transparent 28%),
                radial-gradient(circle at 85% 72%, rgba(53, 127, 239, 0.10), transparent 30%),
                #0b1018;
        }

        .admin-bubble {
            width: fit-content;
            max-width: min(760px, 88%);
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            background: var(--panel-2);
        }

        .admin-bubble.outgoing {
            justify-self: end;
            background: #1f3146;
        }

        .admin-bubble strong {
            display: block;
            margin-bottom: 4px;
            color: #c8d7ff;
            font-size: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .form-grid label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 7px;
            color: var(--text);
            background: #090d15;
            resize: vertical;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .design-tabs {
            display: flex;
            gap: 8px;
            margin: 10px 0 14px;
        }

        .design-tabs button.active {
            background: var(--blue);
        }

        .logo-preview {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-preview img {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            object-fit: contain;
            background: #05070c;
        }

        .chip {
            padding: 5px 8px;
            border-radius: 999px;
            color: #d7e4ff;
            background: rgba(255, 255, 255, 0.08);
            font-size: 12px;
        }

        .media {
            display: block;
            max-width: 100%;
            max-height: 260px;
            margin-top: 8px;
            border-radius: 8px;
            background: #000;
            object-fit: contain;
        }

        .meta {
            color: var(--muted);
            font-size: 12px;
        }

        .empty {
            padding: 18px;
            border: 1px dashed var(--line);
            border-radius: 8px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.03);
        }

        .status-ok { color: var(--green); }
        .status-warn { color: var(--yellow); }
        .status-error { color: var(--red); }

        body {
            background:
                radial-gradient(circle at 12% 0%, rgba(216, 59, 75, 0.16), transparent 28%),
                radial-gradient(circle at 90% 18%, rgba(53, 119, 217, 0.14), transparent 32%),
                var(--bg);
            font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
        }

        .shell {
            grid-template-columns: 330px minmax(0, 1fr);
        }

        .side {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: auto;
            background: rgba(23, 27, 37, 0.94);
            backdrop-filter: blur(18px);
        }

        .brand img {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            filter: drop-shadow(0 0 18px rgba(216, 59, 75, 0.42));
        }

        button {
            border: 1px solid transparent;
            border-radius: 14px;
            background: var(--panel-2);
            transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
        }

        button:hover {
            border-color: rgba(216, 59, 75, 0.28);
            transform: translateY(-1px);
        }

        input,
        textarea {
            border-radius: 14px;
            background: var(--panel-2);
        }

        input:focus,
        textarea:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(216, 59, 75, 0.15);
        }

        .primary,
        .tab.active {
            background: linear-gradient(135deg, var(--red), #a92d3c);
            box-shadow: 0 0 18px rgba(216, 59, 75, 0.26);
        }

        .tabs {
            gap: 10px;
        }

        .tab {
            min-height: 44px;
            text-align: left;
            color: var(--muted);
            background: transparent;
        }

        .tab.active {
            color: #fff;
        }

        .content {
            padding: 22px;
        }

        .toolbar {
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: rgba(23, 27, 37, 0.90);
            backdrop-filter: blur(16px);
        }

        .metric,
        .card,
        .message,
        .conversation-view,
        .empty {
            border-radius: 18px;
            background: rgba(23, 27, 37, 0.92);
        }

        .card {
            padding: 18px;
            box-shadow: 0 16px 44px rgba(0, 0, 0, 0.18);
        }

        .conversation-view {
            background:
                radial-gradient(circle at 16% 12%, rgba(216, 59, 75, 0.10), transparent 28%),
                radial-gradient(circle at 85% 72%, rgba(53, 119, 217, 0.10), transparent 30%),
                #11151d;
        }

        .admin-bubble {
            border-radius: 16px;
            background: #202631;
        }

        .admin-bubble.outgoing {
            background: #0c5d4e;
        }

        .design-tabs button.active {
            background: linear-gradient(135deg, var(--red), #a92d3c);
        }

        .logo-preview {
            margin-top: 12px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--panel-2);
        }

        .logo-preview img {
            background: #10131b;
            filter: drop-shadow(0 0 16px rgba(216, 59, 75, 0.30));
        }

        :root {
            --bg: #05070b;
            --panel: rgba(13, 18, 28, 0.82);
            --panel-2: rgba(24, 31, 43, 0.78);
            --line: rgba(118, 145, 190, 0.18);
            --text: #f4f7fb;
            --muted: #9aa5b4;
            --red: #e5485d;
            --blue: #2f80ff;
            --green: #2ed3c6;
            --yellow: #f7c948;
            --purple: #7b4dff;
            --premium-gradient: linear-gradient(135deg, var(--blue), var(--purple) 58%, var(--green));
            --glass: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
        }

        body {
            background:
                radial-gradient(circle at 10% -4%, rgba(47,128,255,.28), transparent 32%),
                radial-gradient(circle at 86% 10%, rgba(123,77,255,.22), transparent 34%),
                radial-gradient(circle at 58% 105%, rgba(46,211,198,.14), transparent 40%),
                var(--bg);
        }

        .side,
        .toolbar,
        .metric,
        .card,
        .message,
        .conversation-view,
        .empty,
        .logo-preview {
            border: 1px solid var(--line);
            background: var(--glass);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 24px 80px rgba(0,0,0,.22);
            backdrop-filter: blur(22px);
        }

        .side {
            background: rgba(7, 10, 16, 0.76);
        }

        .brand img {
            filter: drop-shadow(0 0 18px rgba(47,128,255,.36));
        }

        .primary,
        .tab.active,
        .design-tabs button.active {
            background: var(--premium-gradient);
            color: #fff;
            box-shadow: 0 18px 42px rgba(47,128,255,.22);
        }

        .danger {
            background: linear-gradient(135deg, var(--red), #b8213d);
        }

        button {
            border-color: rgba(255,255,255,.08);
            border-radius: 16px;
            background: rgba(255,255,255,.065);
        }

        button:hover {
            border-color: rgba(47,128,255,.38);
            box-shadow: 0 10px 28px rgba(47,128,255,.12);
        }

        input,
        textarea {
            border-color: var(--line);
            background: rgba(5,7,11,.62);
        }

        input:focus,
        textarea:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(47,128,255,.16);
        }

        .admin-bubble.outgoing {
            background: linear-gradient(135deg, rgba(47,128,255,.86), rgba(123,77,255,.84));
        }

        .conversation-view {
            background:
                radial-gradient(circle at 16% 12%, rgba(47,128,255,.13), transparent 28%),
                radial-gradient(circle at 85% 72%, rgba(46,211,198,.10), transparent 30%),
                rgba(5, 7, 11, .78);
        }

        .hidden { display: none !important; }

        @media (max-width: 760px) {
            .shell {
                grid-template-columns: 1fr;
                min-height: 0;
            }
            .side { position: relative; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
            .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .content { padding: 12px; }
            .toolbar { grid-template-columns: 1fr; }
            .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .card-row { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <aside class="side">
            <div class="brand">
                <img src="/static/nexaline-logo.png" alt="NexaLine">
                <div>
                    <h1>NexaLine Admin</h1>
                    <small id="ipInfo">IP bilgisi yükleniyor</small>
                </div>
            </div>

            <div class="token-box">
                <input id="tokenInput" type="password" placeholder="ADMIN_TOKEN">
                <button id="loadButton" class="primary" type="button">Paneli Aç</button>
                <small id="tokenHint">Bu bilgisayardan açıyorsan token gerekmez. Dışarıdan giriş için ADMIN_TOKEN gerekir.</small>
                <small>Şifreler güvenlik için gösterilmez. Buradan yeni şifre atayabilirsin.</small>
            </div>

            <nav class="tabs">
                <button class="tab active" data-view="users" type="button">Kullanıcılar</button>
                <button class="tab" data-view="chats" type="button">Sohbetler</button>
                <button class="tab" data-view="messages" type="button">Mesajlar</button>
                <button class="tab" data-view="activity" type="button">Etkinlik</button>
                <button class="tab" data-view="updates" type="button">Güncellemeler</button>
                <button class="tab" data-view="aiPoints" type="button">AI & Puan</button>
                <button class="tab" data-view="roomsGames" type="button">Oda & Oyun</button>
                <button class="tab" data-view="stories" type="button">Durumlar</button>
                <button class="tab" data-view="calls" type="button">Aramalar</button>
                <button class="tab" data-view="scheduled" type="button">Zamanlı</button>
                <button class="tab" data-view="archives" type="button">Arşivler</button>
                <button class="tab" data-view="social" type="button">Engel/İstek</button>
                <button class="tab" data-view="design" type="button">Tasarım</button>
                <button class="tab" data-view="create" type="button">Hesap Aç</button>
            </nav>
        </aside>

        <section class="content">
            <div class="toolbar">
                <input id="adminSearch" placeholder="Kullanıcı, mesaj, sohbet ara">
                <button id="refreshButton" type="button">Yenile</button>
                <button id="deleteAllButton" class="danger" type="button">Tüm Verileri Sıfırla</button>
            </div>
            <div id="status" class="meta"></div>
            <div id="summary" class="summary"></div>
            <div id="view"></div>
        </section>
    </main>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js").catch(error => console.warn("PWA kaydı yapılamadı", error));
            });
        }

        const state = { token: localStorage.getItem("nexalineAdminToken") || "", view: "users", data: null, query: "", designDevice: "desktop", selectedUser: "", selectedChat: "" };
        const ADMIN_LOAD_TIMEOUT_MS = 15000;
        const $ = id => document.getElementById(id);
        $("tokenInput").value = state.token;

        function headers() {
            return { "Content-Type": "application/json", "X-Admin-Token": state.token };
        }

        async function api(path, options = {}) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ADMIN_LOAD_TIMEOUT_MS);
            let response;
            try {
                response = await fetch(path, {
                    ...options,
                    cache: "no-store",
                    signal: controller.signal,
                    headers: { ...headers(), ...(options.headers || {}) }
                });
            } catch (error) {
                if (error.name === "AbortError") {
                    throw new Error("Panel çok geç cevap verdi. Sunucu çalışıyor mu kontrol et.");
                }
                throw new Error("Sunucuya bağlanılamadı. Sayfa açık ama arka uç cevap vermiyor.");
            } finally {
                clearTimeout(timer);
            }
            const data = await response.json().catch(() => ({ ok: false, message: "Sunucu cevabı okunamadı." }));
            if (!data.ok) {
                throw new Error(data.message || (response.ok ? "İşlem başarısız." : `Sunucu hata verdi (${response.status}).`));
            }
            return data;
        }

        function setStatus(message, type = "ok") {
            $("status").textContent = message;
            $("status").className = `meta status-${type}`;
        }

        async function load() {
            state.token = $("tokenInput").value.trim();
            localStorage.setItem("nexalineAdminToken", state.token);
            setStatus("Yükleniyor...", "warn");
            $("loadButton").disabled = true;
            $("refreshButton").disabled = true;
            try {
                state.data = await api("/admin/state");
                $("ipInfo").textContent = `Sen: ${state.data.yourIp} • Sunucu: ${state.data.serverIp}`;
                $("tokenHint").textContent = state.data.localAdmin
                    ? "Yerel bilgisayardan açıldı: token olmadan yetkili."
                    : "Dış bağlantı: ADMIN_TOKEN gerekli.";
                setStatus("Hazır", "ok");
                render();
            } catch (error) {
                state.data = null;
                setStatus(error.message, "error");
                $("summary").innerHTML = "";
                $("view").innerHTML = `<div class="empty">${escapeHtml(error.message)}<br>Yerel bilgisayardan açmıyorsan ADMIN_TOKEN girip tekrar dene.</div>`;
            } finally {
                $("loadButton").disabled = false;
                $("refreshButton").disabled = false;
            }
        }

        function render() {
            document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.view === state.view));
            if (!state.data) {
                $("view").innerHTML = "<p>Paneli açmak için token gir.</p>";
                return;
            }
            state.query = $("adminSearch").value.trim().toLowerCase();
            renderSummary();
            if (state.view === "users") renderUsers();
            if (state.view === "chats") renderChats();
            if (state.view === "messages") renderMessages();
            if (state.view === "activity") renderActivity();
            if (state.view === "updates") renderUpdates();
            if (state.view === "aiPoints") renderAiPoints();
            if (state.view === "roomsGames") renderRoomsGames();
            if (state.view === "stories") renderStories();
            if (state.view === "calls") renderCalls();
            if (state.view === "scheduled") renderScheduled();
            if (state.view === "archives") renderArchives();
            if (state.view === "social") renderSocial();
            if (state.view === "design") renderDesign();
            if (state.view === "create") renderCreateUsers();
            if (state.view === "userChats") renderUserChats(state.selectedUser);
            if (state.view === "conversation") renderConversation(state.selectedChat, state.selectedUser);
        }

        function renderSummary() {
            const messageCount = state.data.chats.reduce((total, chat) => total + (chat.messageCount || chat.messages.length), 0);
            $("summary").innerHTML = `
                <div class="metric"><strong>${state.data.users.length}</strong><small>Kullanıcı</small></div>
                <div class="metric"><strong>${state.data.chats.length}</strong><small>Sohbet</small></div>
                <div class="metric"><strong>${messageCount}</strong><small>Mesaj</small></div>
                <div class="metric"><strong>${state.data.stories.length}</strong><small>Durum</small></div>
                <div class="metric"><strong>${state.data.calls.length}</strong><small>Arama</small></div>
                <div class="metric"><strong>${state.data.updates?.length || 0}</strong><small>Güncelleme</small></div>
                <div class="metric"><strong>${state.data.aiMemories?.length || 0}</strong><small>AI Hafıza</small></div>
                <div class="metric"><strong>${state.data.voiceRooms?.length || 0}</strong><small>Sesli Oda</small></div>
                <div class="metric"><strong>${state.data.nexaPlay?.length || 0}</strong><small>Oyuncu</small></div>
                <div class="metric"><strong>${state.data.scheduledMessages?.length || 0}</strong><small>Zamanlı</small></div>
                <div class="metric"><strong>${state.data.archives?.length || 0}</strong><small>Arşiv</small></div>
                <div class="metric"><strong>${state.data.blocks?.length || 0}</strong><small>Engel</small></div>
                <div class="metric"><strong>${(state.data.contactRequests?.length || 0) + (state.data.groupInvites?.length || 0)}</strong><small>İstek</small></div>
                <div class="metric"><strong>${escapeHtml(state.data.ai?.provider || "local")}</strong><small>AI</small></div>
            `;
        }

        function matchesSearch(...values) {
            if (!state.query) return true;
            return values.some(value => String(value ?? "").toLowerCase().includes(state.query));
        }

        function empty(message) {
            return `<div class="empty">${escapeHtml(message)}</div>`;
        }

        function renderUsers() {
            const users = state.data.users.filter(user => matchesSearch(user.username, user.displayName, user.about, user.email));
            $("view").innerHTML = `<h2>Kullanıcılar (${users.length}/${state.data.users.length})</h2><div class="grid"></div>`;
            const grid = $("view").querySelector(".grid");
            if (!users.length) {
                grid.innerHTML = empty(state.data.users.length ? "Aramana uygun kullanıcı yok." : "Henüz kayıtlı kullanıcı yok. Normal giriş sayfasından kayıt olunca burada görünür.");
                return;
            }
            users.forEach(user => {
                const card = document.createElement("article");
                card.className = "card";
                card.innerHTML = `
                    <h3>${escapeHtml(user.displayName)} (@${escapeHtml(user.username)})</h3>
                    <p>${user.online ? "çevrimiçi" : "çevrimdışı"} • ${escapeHtml(user.email || "Gmail yok")} • ${new Date(user.createdAt).toLocaleString("tr-TR")}</p>

            $("bulkCreateButton").onclick = async () => {
                const lines = $("bulkUsers").value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);

                    const [displayName, email, password, username] = line.split("|").map(part => part?.trim() || "");

        function handleDesignLogoFile(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            if (file.size > 650000) {
                alert("Logo 650 KB altında olmalı.");
                event.target.value = "";

            const reader = new FileReader();
            reader.onload = () => {

            };
            reader.readAsDataURL(file);

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/`/g, "&#096;");
        }

        function renderLinkPreview(text) {
            const url = (String(text || "").match(/https?:\/\/[^\s<>"']+/i) || [])[0];
            if (!url) return "";
            let parsed;
            try {
                parsed = new URL(url);
            } catch (_error) {
                return "";
            }
            return `<a class="empty" href="${escapeAttr(parsed.href)}" target="_blank" rel="noreferrer">${escapeHtml(parsed.hostname.replace(/^www\./, ""))}<br><small>${escapeHtml(parsed.href)}</small></a>`;
        }

        function renderAttachment(attachment) {
            if (!attachment) return "";
            const name = escapeAttr(attachment.name || "Dosya");
            if (attachment.type === "contact") {
                return `<div class="empty">Kişi: ${escapeHtml(attachment.contact?.displayName || attachment.contact?.username || attachment.name || "NexaLine")}</div>`;
            }
            if (attachment.type === "poll") {
                const poll = attachment.poll || {};
                return `<div class="empty">Anket: ${escapeHtml(poll.question || attachment.name || "Anket")}<br>${(poll.options || []).map(option => `• ${escapeHtml(option)}`).join("<br>")}</div>`;
            }
            if (!attachment?.dataUrl) {
                if (attachment?.dataUrlOmitted) {
                    return `<div class="empty">${name} önizlemesi hız için yüklenmedi.</div>`;
                }
                return "";
            }
            if (attachment.type?.startsWith("image/")) {
                return `<img class="media" src="${escapeAttr(attachment.dataUrl)}" alt="${name}" loading="lazy">`;
            }
            if (attachment.type?.startsWith("video/")) {
                return `<video class="media" src="${escapeAttr(attachment.dataUrl)}" controls playsinline></video>`;
            }
            if (attachment.type?.startsWith("audio/")) {
                return `<audio class="media" src="${escapeAttr(attachment.dataUrl)}" controls></audio>${attachment.transcript ? `<div class="empty">Yazıya döküm: ${escapeHtml(attachment.transcript)}</div>` : ""}`;
            }
            return `<a class="meta" href="${escapeAttr(attachment.dataUrl)}" download="${name}">${name}</a>`;
        }

        document.querySelectorAll(".tab").forEach(tab => {
            tab.onclick = () => {
                state.view = tab.dataset.view;
                render();
            };
        });
        load();
    </script>
</body>
