<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111722">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NexaLine Admin">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NexaLine Admin</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <style>
        :root {
            --bg: #070a10;
            --panel: #111722;
            --panel-2: #192131;
            --line: #30394b;
            --text: #eef4ff;
            --muted: #95a0b5;
            --red: #f03d54;
            --blue: #2f8cff;
            --green: #2bd576;
            --yellow: #f5c451;
        }

        * { box-sizing: border-box; min-width: 0; }
        body {
            margin: 0;
            max-width: 100vw;
            overflow-x: hidden;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
        }

        button, input { font: inherit; }
        button {
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            color: #fff;
            background: var(--panel-2);
            min-height: 38px;
            padding: 9px 12px;
            line-height: 1.15;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        input, textarea, p, small, strong, h1, h2, h3, .message, .card, .chip {
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .shell {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            min-height: 100vh;
            max-width: 100vw;
        }

        .side {
            padding: 18px;
            border-right: 1px solid var(--line);
            background: var(--panel);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .brand img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        h1, h2, h3, p { margin-top: 0; }
        h1 { font-size: 24px; }
        h2 { font-size: 20px; }
        h3 { font-size: 15px; }
        p, small { color: var(--muted); }
        h1, h2, h3 { line-height: 1.2; }

        .token-box {
            display: grid;
            gap: 8px;
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 7px;
            outline: none;
            color: var(--text);
            background: #090d15;
        }

        .primary { background: linear-gradient(135deg, var(--red), var(--blue)); }
        .danger { background: var(--red); }
        .ok { background: var(--green); color: #06100a; }

        .tabs {
            display: grid;
            gap: 8px;
        }

        .tab {
            padding: 11px 12px;
            text-align: left;
        }

        .tab.active {
            background: var(--blue);
        }

        .content {
            min-width: 0;
            padding: 18px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 10px;
            margin-bottom: 16px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .metric {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .metric strong {
            display: block;
            margin-bottom: 3px;
            font-size: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }

        .card {
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .list {
            display: grid;
            gap: 10px;
        }

        .message {
            padding: 10px;
            border-left: 3px solid var(--blue);
            border-radius: 7px;
            background: var(--panel-2);
        }

        .message.deleted-message {
            border-left-color: var(--yellow);
            opacity: 0.82;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .form-grid label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 7px;
            color: var(--text);
            background: #090d15;
            resize: vertical;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            padding: 5px 8px;
            border-radius: 999px;
            color: #d7e4ff;
            background: rgba(255, 255, 255, 0.08);
            font-size: 12px;
        }

        .media {
            display: block;
            max-width: 100%;
            max-height: 260px;
            margin-top: 8px;
            border-radius: 8px;
            background: #000;
            object-fit: contain;
        }

        .meta {
            color: var(--muted);
            font-size: 12px;
        }

        .empty {
            padding: 18px;
            border: 1px dashed var(--line);
            border-radius: 8px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.03);
        }

        .status-ok { color: var(--green); }
        .status-warn { color: var(--yellow); }
        .status-error { color: var(--red); }

        .hidden { display: none !important; }

        @media (max-width: 760px) {
            .shell {
                grid-template-columns: 1fr;
                min-height: 0;
            }
            .side { border-right: 0; border-bottom: 1px solid var(--line); }
            .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .content { padding: 12px; }
            .toolbar { grid-template-columns: 1fr; }
            .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .card-row { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <aside class="side">
            <div class="brand">
                <img src="/static/nexaline-mark.png" alt="NexaLine">
                <div>
                    <h1>NexaLine Admin</h1>
                    <small id="ipInfo">IP bilgisi yükleniyor</small>
                </div>
            </div>

            <div class="token-box">
                <input id="tokenInput" type="password" placeholder="ADMIN_TOKEN">
                <button id="loadButton" class="primary" type="button">Paneli Aç</button>
                <small id="tokenHint">Bu bilgisayardan açıyorsan token gerekmez. Dışarıdan giriş için ADMIN_TOKEN gerekir.</small>
                <small>Şifreler güvenlik için gösterilmez. Buradan yeni şifre atayabilirsin.</small>
            </div>

            <nav class="tabs">
                <button class="tab active" data-view="users" type="button">Kullanıcılar</button>
                <button class="tab" data-view="chats" type="button">Sohbetler</button>
                <button class="tab" data-view="messages" type="button">Mesajlar</button>
                <button class="tab" data-view="stories" type="button">Durumlar</button>
                <button class="tab" data-view="calls" type="button">Aramalar</button>
                <button class="tab" data-view="scheduled" type="button">Zamanlı</button>
                <button class="tab" data-view="archives" type="button">Arşivler</button>
                <button class="tab" data-view="social" type="button">Engel/İstek</button>
                <button class="tab" data-view="design" type="button">Tasarım</button>
                <button class="tab" data-view="create" type="button">Hesap Aç</button>
            </nav>
        </aside>

        <section class="content">
            <div class="toolbar">
                <input id="adminSearch" placeholder="Kullanıcı, mesaj, sohbet ara">
                <button id="refreshButton" type="button">Yenile</button>
                <button id="deleteAllButton" class="danger" type="button">Tüm Verileri Sıfırla</button>
            </div>
            <div id="status" class="meta"></div>
            <div id="summary" class="summary"></div>
            <div id="view"></div>
        </section>
    </main>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js").catch(error => console.warn("PWA kaydı yapılamadı", error));
            });
        }

        const state = { token: localStorage.getItem("nexalineAdminToken") || "", view: "users", data: null, query: "" };
        const ADMIN_LOAD_TIMEOUT_MS = 15000;
        const $ = id => document.getElementById(id);
        $("tokenInput").value = state.token;

        function headers() {
            return { "Content-Type": "application/json", "X-Admin-Token": state.token };
        }

        async function api(path, options = {}) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ADMIN_LOAD_TIMEOUT_MS);
            let response;
            try {
                response = await fetch(path, {
                    ...options,
                    cache: "no-store",
                    signal: controller.signal,
                    headers: { ...headers(), ...(options.headers || {}) }
                });
            } catch (error) {
                if (error.name === "AbortError") {
                    throw new Error("Panel çok geç cevap verdi. Sunucu çalışıyor mu kontrol et.");
                }
                throw new Error("Sunucuya bağlanılamadı. Sayfa açık ama arka uç cevap vermiyor.");
            } finally {
                clearTimeout(timer);
            }
            const data = await response.json().catch(() => ({ ok: false, message: "Sunucu cevabı okunamadı." }));
            if (!data.ok) {
                throw new Error(data.message || (response.ok ? "İşlem başarısız." : `Sunucu hata verdi (${response.status}).`));
            }
            return data;
        }

        function setStatus(message, type = "ok") {
            $("status").textContent = message;
            $("status").className = `meta status-${type}`;
        }

        async function load() {
            state.token = $("tokenInput").value.trim();
            localStorage.setItem("nexalineAdminToken", state.token);
            setStatus("Yükleniyor...", "warn");
            $("loadButton").disabled = true;
            $("refreshButton").disabled = true;
            try {
                state.data = await api("/admin/state");
                $("ipInfo").textContent = `Sen: ${state.data.yourIp} • Sunucu: ${state.data.serverIp}`;
                $("tokenHint").textContent = state.data.localAdmin
                    ? "Yerel bilgisayardan açıldı: token olmadan yetkili."
                    : "Dış bağlantı: ADMIN_TOKEN gerekli.";
                setStatus("Hazır", "ok");
                render();
            } catch (error) {
                state.data = null;
                setStatus(error.message, "error");
                $("summary").innerHTML = "";
                $("view").innerHTML = `<div class="empty">${escapeHtml(error.message)}<br>Yerel bilgisayardan açmıyorsan ADMIN_TOKEN girip tekrar dene.</div>`;
            } finally {
                $("loadButton").disabled = false;
                $("refreshButton").disabled = false;
            }
        }

        function render() {
            document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.view === state.view));
            if (!state.data) {
                $("view").innerHTML = "<p>Paneli açmak için token gir.</p>";
                return;
            }
            state.query = $("adminSearch").value.trim().toLowerCase();
            renderSummary();
            if (state.view === "users") renderUsers();
            if (state.view === "chats") renderChats();
            if (state.view === "messages") renderMessages();
            if (state.view === "stories") renderStories();
            if (state.view === "calls") renderCalls();
            if (state.view === "scheduled") renderScheduled();
            if (state.view === "archives") renderArchives();
            if (state.view === "social") renderSocial();
            if (state.view === "design") renderDesign();
            if (state.view === "create") renderCreateUsers();
        }

        function renderSummary() {
            const messageCount = state.data.chats.reduce((total, chat) => total + (chat.messageCount || chat.messages.length), 0);
            $("summary").innerHTML = `
                <div class="metric"><strong>${state.data.users.length}</strong><small>Kullanıcı</small></div>
                <div class="metric"><strong>${state.data.chats.length}</strong><small>Sohbet</small></div>
                <div class="metric"><strong>${messageCount}</strong><small>Mesaj</small></div>
                <div class="metric"><strong>${state.data.stories.length}</strong><small>Durum</small></div>
                <div class="metric"><strong>${state.data.calls.length}</strong><small>Arama</small></div>
                <div class="metric"><strong>${state.data.scheduledMessages?.length || 0}</strong><small>Zamanlı</small></div>
                <div class="metric"><strong>${state.data.archives?.length || 0}</strong><small>Arşiv</small></div>
                <div class="metric"><strong>${state.data.blocks?.length || 0}</strong><small>Engel</small></div>
                <div class="metric"><strong>${(state.data.contactRequests?.length || 0) + (state.data.groupInvites?.length || 0)}</strong><small>İstek</small></div>
                <div class="metric"><strong>${escapeHtml(state.data.ai?.provider || "local")}</strong><small>AI</small></div>
            `;
        }

        function matchesSearch(...values) {
            if (!state.query) return true;
            return values.some(value => String(value ?? "").toLowerCase().includes(state.query));
        }

        function empty(message) {
            return `<div class="empty">${escapeHtml(message)}</div>`;
        }

        function renderUsers() {
            const users = state.data.users.filter(user => matchesSearch(user.username, user.displayName, user.about, user.email));
            $("view").innerHTML = `<h2>Kullanıcılar (${users.length}/${state.data.users.length})</h2><div class="grid"></div>`;
            const grid = $("view").querySelector(".grid");
            if (!users.length) {
                grid.innerHTML = empty(state.data.users.length ? "Aramana uygun kullanıcı yok." : "Henüz kayıtlı kullanıcı yok. Normal giriş sayfasından kayıt olunca burada görünür.");
                return;
            }
            users.forEach(user => {
                const card = document.createElement("article");
                card.className = "card";
                card.innerHTML = `
                    <h3>${escapeHtml(user.displayName)} (@${escapeHtml(user.username)})</h3>
                    <p>${user.online ? "çevrimiçi" : "çevrimdışı"} • ${escapeHtml(user.email || "Gmail yok")} • ${new Date(user.createdAt).toLocaleString("tr-TR")}</p>
                    <div class="chip-row">
                        <span class="chip">${user.emailVerified ? "E-posta doğrulanmış" : "E-posta doğrulanmamış"}</span>
                        <span class="chip">${user.privacy?.lastSeenHidden ? "Son görülme kapalı" : "Son görülme açık"}</span>
                        <span class="chip">${user.privacy?.onlineHidden ? "Çevrim içi gizli" : "Çevrim içi açık"}</span>
                        <span class="chip">${user.privacy?.readReceiptsOff ? "Okundu kapalı" : "Okundu açık"}</span>
                        <span class="chip">${user.privacy?.emailHidden ? "Gmail gizli" : "Gmail görünür"}</span>
                    </div>
                    <div class="card-row">
                        <button data-privacy="${user.username}" type="button">Gizlilik</button>
                        <button class="ok" data-reset="${user.username}" type="button">Şifre Sıfırla</button>
                        <button class="danger" data-delete="${user.username}" type="button">Sil</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            grid.querySelectorAll("[data-privacy]").forEach(button => button.onclick = () => editUserPrivacy(button.dataset.privacy));
            grid.querySelectorAll("[data-delete]").forEach(button => button.onclick = () => deleteUser(button.dataset.delete));
            grid.querySelectorAll("[data-reset]").forEach(button => button.onclick = () => resetPassword(button.dataset.reset));
        }

        function renderChats() {
            const chats = state.data.chats.filter(chat => matchesSearch(
                chat.title,
                chat.type,
                chat.members.map(member => `${member.username} ${member.displayName}`).join(" "),
                chat.messages.map(message => `${message.senderName} ${message.body} ${message.attachment?.name || ""}`).join(" ")
            ));
            $("view").innerHTML = `<h2>Sohbetler (${chats.length}/${state.data.chats.length})</h2><div class="list"></div>`;
            const list = $("view").querySelector(".list");
            if (!chats.length) {
                list.innerHTML = empty(state.data.chats.length ? "Aramana uygun sohbet yok." : "Henüz sohbet yok.");
                return;
            }
            chats.forEach(chat => {
                const item = document.createElement("article");
                item.className = "card";
                item.innerHTML = `
                    <h3>${escapeHtml(chat.title)} (${chat.type})</h3>
                    <p>${chat.members.map(member => `${escapeHtml(member.displayName)}${member.isAdmin ? " - Yönetici" : ""}`).join(", ") || "Üye yok"}</p>
                    <div class="card-row">
                        <small>${chat.messageCount || chat.messages.length} mesaj${chat.messageCount > chat.messages.length ? ` - son ${chat.messages.length} yüklendi` : ""}</small>
                        ${chat.id === "lobby" ? "" : `<button class="danger" data-chat="${escapeAttr(chat.id)}" type="button">Sohbeti Sil</button>`}
                    </div>
                `;
                list.appendChild(item);
            });
            list.querySelectorAll("[data-chat]").forEach(button => button.onclick = () => deleteChat(button.dataset.chat));
        }

        function renderMessages() {
            const messages = [];
            state.data.chats.forEach(chat => {
                chat.messages.forEach(message => messages.push({ chat, message }));
            });
            const totalMessages = state.data.chats.reduce((total, chat) => total + (chat.messageCount || chat.messages.length), 0);
            const filtered = messages.filter(({ chat, message }) => matchesSearch(
                chat.title,
                message.sender,
                message.senderName,
                message.body,
                message.attachment?.name,
                message.attachment?.type
            ));
            $("view").innerHTML = `<h2>Mesajlar (${filtered.length}/${messages.length} yüklendi, toplam ${totalMessages})</h2><div class="list"></div>`;
            const list = $("view").querySelector(".list");
            if (!filtered.length) {
                list.innerHTML = empty(messages.length ? "Aramana uygun mesaj yok." : "Henüz mesaj yok.");
                return;
            }
            filtered.forEach(({ chat, message }) => {
                const item = document.createElement("article");
                item.className = "message" + (message.deletedAt ? " deleted-message" : "");
                item.innerHTML = `
                    <strong>${escapeHtml(chat.title)} • ${escapeHtml(message.senderName)}</strong>
                    <p>${escapeHtml(message.deletedAt ? "Bu mesaj kullanıcı tarafından geri çekildi." : (message.body || message.attachment?.name || message.attachment?.type || "Dosya"))}</p>
                    ${renderLinkPreview(message.body)}
                    ${renderAttachment(message.attachment)}
                    <div class="card-row">
                        <span class="meta">${new Date(message.createdAt).toLocaleString("tr-TR")}${message.deletedAt ? " • silindi" : ""}</span>
                        <button class="danger" data-message="${message.id}" type="button">Mesajı Sil</button>
                    </div>
                `;
                list.appendChild(item);
            });
            list.querySelectorAll("[data-message]").forEach(button => button.onclick = () => deleteMessage(button.dataset.message));
        }

        function renderStories() {
            const stories = state.data.stories.filter(story => matchesSearch(story.username, story.user.displayName, story.body, story.attachment?.name));
            $("view").innerHTML = `<h2>Durumlar (${stories.length}/${state.data.stories.length})</h2><div class="grid"></div>`;
            const grid = $("view").querySelector(".grid");
            if (!stories.length) {
                grid.innerHTML = empty(state.data.stories.length ? "Aramana uygun durum yok." : "Henüz durum paylaşılmadı.");
                return;
            }
            stories.forEach(story => {
                const card = document.createElement("article");
                card.className = "card";
                card.innerHTML = `
                    <h3>${escapeHtml(story.user.displayName)}</h3>
                    <p>${escapeHtml(story.body || story.attachment?.name || "Durum")}</p>
                    ${renderAttachment(story.attachment)}
                    <div class="card-row">
                        <small>${new Date(story.createdAt).toLocaleString("tr-TR")} - ${new Date(story.expiresAt).toLocaleString("tr-TR")}</small>
                        <button class="danger" data-story="${story.id}" type="button">Durumu Sil</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            grid.querySelectorAll("[data-story]").forEach(button => button.onclick = () => deleteStory(button.dataset.story));
        }

        function renderCalls() {
            const calls = state.data.calls.filter(call => matchesSearch(call.chatTitle, call.caller, call.callerName, call.kind, call.status));
            $("view").innerHTML = `<h2>Aramalar (${calls.length}/${state.data.calls.length})</h2><div class="list"></div>`;
            const list = $("view").querySelector(".list");
            if (!calls.length) {
                list.innerHTML = empty(state.data.calls.length ? "Aramana uygun arama kaydı yok." : "Henüz arama kaydı yok.");
                return;
            }
            calls.forEach(call => {
                const item = document.createElement("article");
                item.className = "card";
                item.innerHTML = `
                    <h3>${escapeHtml(call.chatTitle)} • ${call.kind === "video" ? "Görüntülü" : "Sesli"}</h3>
                    <p>${escapeHtml(call.callerName)} • ${call.status === "active" ? "aktif" : `${call.durationSeconds} sn`}</p>
                    <small>${new Date(call.startedAt).toLocaleString("tr-TR")}</small>
                `;
                list.appendChild(item);
            });
        }

        function renderScheduled() {
            const items = (state.data.scheduledMessages || []).filter(item => matchesSearch(item.chatTitle, item.sender, item.senderName, item.body, item.attachment?.name));
            $("view").innerHTML = `<h2>Zamanlanmış Mesajlar (${items.length}/${state.data.scheduledMessages?.length || 0})</h2><div class="list"></div>`;
            const list = $("view").querySelector(".list");
            if (!items.length) {
                list.innerHTML = empty((state.data.scheduledMessages || []).length ? "Aramana uygun zamanlı mesaj yok." : "Zamanlanmış mesaj yok.");
                return;
            }
            items.forEach(item => {
                const row = document.createElement("article");
                row.className = "card";
                row.innerHTML = `
                    <h3>${escapeHtml(item.chatTitle)} • ${escapeHtml(item.senderName)}</h3>
                    <p>${escapeHtml(item.body || item.attachment?.name || "Dosya")}</p>
                    ${renderAttachment(item.attachment)}
                    <small>${new Date(item.sendAt).toLocaleString("tr-TR")} gönderilecek${item.expiresInSeconds ? ` • ${item.expiresInSeconds} sn sonra silinir` : ""}</small>
                `;
                list.appendChild(row);
            });
        }

        function renderArchives() {
            const archives = (state.data.archives || []).filter(archive => matchesSearch(
                archive.username,
                archive.chatTitle,
                archive.reason,
                archive.messages?.map(message => `${message.senderName} ${message.body} ${message.attachment?.name || ""}`).join(" ")
            ));
            $("view").innerHTML = `<h2>Arşivler (${archives.length}/${state.data.archives?.length || 0})</h2><div class="list"></div>`;
            const list = $("view").querySelector(".list");
            if (!archives.length) {
                list.innerHTML = empty((state.data.archives || []).length ? "Aramana uygun arşiv yok." : "Arşivde sohbet yok.");
                return;
            }
            archives.forEach(archive => {
                const item = document.createElement("article");
                item.className = "card";
                const messages = archive.messages || [];
                const preview = messages.slice(-4).map(message => `
                    <div class="message${message.deletedAt ? " deleted-message" : ""}">
                        <strong>${escapeHtml(message.senderName || message.sender || "Kullanıcı")}</strong>
                        <p>${escapeHtml(message.deletedAt ? "Bu mesaj silindi" : (message.body || message.attachment?.name || message.attachment?.type || "Dosya"))}</p>
                        ${renderAttachment(message.attachment)}
                        <small class="meta">${message.createdAt ? new Date(message.createdAt).toLocaleString("tr-TR") : ""}</small>
                    </div>
                `).join("");
                item.innerHTML = `
                    <h3>${escapeHtml(archive.chatTitle)} • ${escapeHtml(archive.username)}</h3>
                    <p>${archive.reason === "blocked" ? "Engellenirken arşivlendi" : "Silinen sohbet"} • ${archive.messageCount} mesaj • ${new Date(archive.expiresAt).toLocaleString("tr-TR")} kalıcı silinir</p>
                    <div class="list">${preview || empty("Bu arşivde mesaj yok.")}</div>
                    <div class="card-row">
                        <button class="ok" data-restore-archive="${escapeAttr(archive.id)}" type="button">Arşivden Çıkar</button>
                        <button class="danger" data-delete-archive="${escapeAttr(archive.id)}" type="button">Kalıcı Sil</button>
                    </div>
                `;
                list.appendChild(item);
            });
            list.querySelectorAll("[data-restore-archive]").forEach(button => button.onclick = () => restoreArchive(button.dataset.restoreArchive));
            list.querySelectorAll("[data-delete-archive]").forEach(button => button.onclick = () => deleteArchive(button.dataset.deleteArchive));
        }

        function renderSocial() {
            const blocks = (state.data.blocks || []).filter(item => matchesSearch(item.blocker?.displayName, item.blocked?.displayName, item.blocker?.username, item.blocked?.username));
            const contactRequests = (state.data.contactRequests || []).filter(item => matchesSearch(item.from?.displayName, item.to?.displayName, item.status));
            const groupInvites = (state.data.groupInvites || []).filter(item => matchesSearch(item.chatTitle, item.inviter?.displayName, item.invitee?.displayName, item.status));
            $("view").innerHTML = `
                <h2>Engel ve İstekler</h2>
                <div class="grid">
                    <article class="card"><h3>Engeller (${blocks.length})</h3><div id="adminBlocks" class="list"></div></article>
                    <article class="card"><h3>Mesaj İstekleri (${contactRequests.length})</h3><div id="adminContactRequests" class="list"></div></article>
                    <article class="card"><h3>Grup İstekleri (${groupInvites.length})</h3><div id="adminGroupInvites" class="list"></div></article>
                </div>
            `;
            $("adminBlocks").innerHTML = blocks.length ? blocks.map(item => `
                <div class="message">
                    <strong>${escapeHtml(item.blocker?.displayName || item.blocker?.username || "?")} engelledi</strong>
                    <p>${escapeHtml(item.blocked?.displayName || item.blocked?.username || "?")}</p>
                    <small class="meta">${new Date(item.createdAt).toLocaleString("tr-TR")}</small>
                </div>
            `).join("") : empty("Engel kaydı yok.");
            $("adminContactRequests").innerHTML = contactRequests.length ? contactRequests.map(item => `
                <div class="message">
                    <strong>${escapeHtml(item.from?.displayName || "?")} → ${escapeHtml(item.to?.displayName || "?")}</strong>
                    <p>${escapeHtml(item.status || "bekliyor")}</p>
                    <small class="meta">${new Date(item.createdAt).toLocaleString("tr-TR")}</small>
                </div>
            `).join("") : empty("Mesaj isteği yok.");
            $("adminGroupInvites").innerHTML = groupInvites.length ? groupInvites.map(item => `
                <div class="message">
                    <strong>${escapeHtml(item.chatTitle || "Grup")}</strong>
                    <p>${escapeHtml(item.inviter?.displayName || "?")} → ${escapeHtml(item.invitee?.displayName || "?")} • ${escapeHtml(item.status || "bekliyor")}</p>
                    <small class="meta">${new Date(item.createdAt).toLocaleString("tr-TR")}</small>
                </div>
            `).join("") : empty("Grup isteği yok.");
        }

        function renderDesign() {
            const design = state.data.design || {};
            $("view").innerHTML = `
                <h2>Tasarım Kontrolü</h2>
                <article class="card">
                    <h3>Genel görünüm</h3>
                    <div class="form-grid">
                        <label>Site adı<input id="designBrandName" value="${escapeAttr(design.brandName || "NexaLine")}"></label>
                        <label>Genel yazı boyutu<input id="designFontSize" type="number" min="12" max="22" value="${Number(design.fontSize || 16)}"></label>
                        <label>Mesaj yazı boyutu<input id="designMessageFontSize" type="number" min="12" max="22" value="${Number(design.messageFontSize || 15)}"></label>
                        <label>Sohbet listesi genişliği<input id="designSidebarWidth" type="number" min="300" max="520" value="${Number(design.sidebarWidth || 380)}"></label>
                        <label>Baloncuk yuvarlaklığı<input id="designBubbleRadius" type="number" min="0" max="24" value="${Number(design.bubbleRadius || 8)}"></label>
                        <label>Simge buton boyutu<input id="designIconSize" type="number" min="30" max="54" value="${Number(design.iconSize || 38)}"></label>
                        <label>Mavi tema rengi<input id="designBlue" type="color" value="${escapeAttr(design.blue || "#2f8cff")}"></label>
                        <label>Kırmızı tema rengi<input id="designRed" type="color" value="${escapeAttr(design.red || "#f03d54")}"></label>
                        <label>Yeşil tema rengi<input id="designGreen" type="color" value="${escapeAttr(design.green || "#2bd576")}"></label>
                    </div>
                    <div class="card-row">
                        <button id="saveDesignButton" class="primary" type="button">Tasarımı Kaydet</button>
                        <button id="resetDesignButton" type="button">Varsayılana Yaklaştır</button>
                    </div>
                    <p class="meta">Bu ayarlar site açılırken herkese uygulanır. Daha ince metin/simge isimleri için buraya yeni alan ekleyebiliriz.</p>
                </article>
            `;
            $("saveDesignButton").onclick = saveDesign;
            $("resetDesignButton").onclick = () => {
                $("designBrandName").value = "NexaLine";
                $("designFontSize").value = 16;
                $("designMessageFontSize").value = 15;
                $("designSidebarWidth").value = 380;
                $("designBubbleRadius").value = 8;
                $("designIconSize").value = 38;
                $("designBlue").value = "#2f8cff";
                $("designRed").value = "#f03d54";
                $("designGreen").value = "#2bd576";
            };
        }

        function renderCreateUsers() {
            $("view").innerHTML = `
                <h2>Admin Hesap Açma</h2>
                <article class="card">
                    <h3>Tek hesap</h3>
                    <div class="form-grid">
                        <input id="newFirstName" placeholder="İSİM">
                        <input id="newLastName" placeholder="SOYİSİM">
                        <input id="newEmail" placeholder="E-posta (sahte olabilir ama formatlı olsun)">
                        <input id="newUsername" placeholder="Kullanıcı adı (boş kalırsa otomatik)">
                        <input id="newPassword" type="password" placeholder="Güçlü şifre">
                    </div>
                    <button id="createUserButton" class="primary" type="button">Hesabı Oluştur</button>
                </article>
                <article class="card">
                    <h3>Toplu hesap</h3>
                    <p>Her satır: İsim Soyisim | email@example.com | Sifre123! | kullaniciadi</p>
                    <textarea id="bulkUsers" placeholder="Ali Veli | ali@example.com | Guclu123! | aliveli"></textarea>
                    <button id="bulkCreateButton" class="primary" type="button">Toplu Oluştur</button>
                    <div id="bulkResult" class="meta"></div>
                </article>
            `;
            $("createUserButton").onclick = async () => {
                await createAdminUser({
                    firstName: $("newFirstName").value.trim(),
                    lastName: $("newLastName").value.trim(),
                    email: $("newEmail").value.trim(),
                    username: $("newUsername").value.trim(),
                    password: $("newPassword").value
                });
                $("newFirstName").value = "";
                $("newLastName").value = "";
                $("newEmail").value = "";
                $("newUsername").value = "";
                $("newPassword").value = "";
                await load();
                state.view = "create";
                render();
                setStatus("Hesap oluşturuldu.", "ok");
            };
            $("bulkCreateButton").onclick = async () => {
                const lines = $("bulkUsers").value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
                const results = [];
                for (const line of lines) {
                    const [displayName, email, password, username] = line.split("|").map(part => part?.trim() || "");
                    try {
                        await createAdminUser({ displayName, email, password, username });
                        results.push(`Tamam: ${displayName}`);
                    } catch (error) {
                        results.push(`Hata: ${displayName || line} - ${error.message}`);
                    }
                }
                $("bulkResult").innerHTML = results.map(result => `<div>${escapeHtml(result)}</div>`).join("");
                await load();
                state.view = "create";
                render();
            };
        }

        async function createAdminUser(payload) {
            if (!(payload.displayName || (payload.firstName && payload.lastName)) || !payload.email || !payload.password) {
                throw new Error("İsim, soyisim, e-posta ve şifre gerekli.");
            }
            return api("/admin/user", { method: "POST", body: JSON.stringify(payload) });
        }

        async function saveDesign() {
            const design = {
                brandName: $("designBrandName").value.trim(),
                fontSize: Number($("designFontSize").value),
                messageFontSize: Number($("designMessageFontSize").value),
                sidebarWidth: Number($("designSidebarWidth").value),
                bubbleRadius: Number($("designBubbleRadius").value),
                iconSize: Number($("designIconSize").value),
                blue: $("designBlue").value,
                red: $("designRed").value,
                green: $("designGreen").value
            };
            const data = await api("/admin/design", { method: "POST", body: JSON.stringify({ design }) });
            state.data.design = data.design;
            setStatus(data.message || "Tasarım kaydedildi.", "ok");
            renderDesign();
        }

        async function editUserPrivacy(username) {
            const user = state.data.users.find(item => item.username === username);
            if (!user) return;
            const payload = {
                lastSeenHidden: confirm(`${user.displayName}: son görülme gizlensin mi?`),
                onlineHidden: confirm(`${user.displayName}: çevrim içi durumu gizlensin mi?`),
                readReceiptsOff: confirm(`${user.displayName}: okundu bilgisi kapatılsın mı?`),
                emailHidden: confirm(`${user.displayName}: Gmail adresi gizlensin mi?`)
            };
            await api(`/admin/user/${encodeURIComponent(username)}/privacy`, { method: "POST", body: JSON.stringify(payload) });
            await load();
        }

        async function restoreArchive(id) {
            if (!confirm("Bu arşiv sohbet listesine geri çıkarılsın mı?")) return;
            await api(`/admin/archive/${encodeURIComponent(id)}/restore`, { method: "POST" });
            await load();
        }

        async function deleteArchive(id) {
            if (!confirm("Bu arşiv kalıcı olarak silinsin mi?")) return;
            await api(`/admin/archive/${encodeURIComponent(id)}`, { method: "DELETE" });
            await load();
        }

        async function deleteUser(username) {
            if (!confirm(`${username} kullanıcısı silinsin mi?`)) return;
            await api(`/admin/user/${username}`, { method: "DELETE" });
            await load();
        }

        async function deleteMessage(id) {
            if (!confirm("Mesaj silinsin mi?")) return;
            await api(`/admin/message/${id}`, { method: "DELETE" });
            await load();
        }

        async function deleteStory(id) {
            if (!confirm("Durum silinsin mi?")) return;
            await api(`/admin/story/${id}`, { method: "DELETE" });
            await load();
        }

        async function deleteChat(id) {
            if (!confirm("Sohbet ve içindeki tüm mesajlar silinsin mi?")) return;
            await api(`/admin/chat/${encodeURIComponent(id)}`, { method: "DELETE" });
            await load();
        }

        async function resetPassword(username) {
            const password = prompt(`${username} için yeni güçlü şifre`);
            if (!password) return;
            await api(`/admin/user/${username}/password`, { method: "POST", body: JSON.stringify({ password }) });
            alert("Şifre sıfırlandı.");
        }

        async function deleteAll() {
            if (!confirm("Tüm kullanıcılar, sohbetler, mesajlar, durumlar ve arama kayıtları kalıcı olarak silinsin mi?")) return;
            await api("/admin/users", { method: "DELETE", body: JSON.stringify({ token: state.token }) });
            await load();
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/`/g, "&#096;");
        }

        function renderLinkPreview(text) {
            const url = (String(text || "").match(/https?:\/\/[^\s<>"']+/i) || [])[0];
            if (!url) return "";
            let parsed;
            try {
                parsed = new URL(url);
            } catch (_error) {
                return "";
            }
            return `<a class="empty" href="${escapeAttr(parsed.href)}" target="_blank" rel="noreferrer">${escapeHtml(parsed.hostname.replace(/^www\./, ""))}<br><small>${escapeHtml(parsed.href)}</small></a>`;
        }

        function renderAttachment(attachment) {
            if (!attachment) return "";
            const name = escapeAttr(attachment.name || "Dosya");
            if (!attachment?.dataUrl) {
                if (attachment?.dataUrlOmitted) {
                    return `<div class="empty">${name} önizlemesi hız için yüklenmedi.</div>`;
                }
                return "";
            }
            if (attachment.type?.startsWith("image/")) {
                return `<img class="media" src="${escapeAttr(attachment.dataUrl)}" alt="${name}" loading="lazy">`;
            }
            if (attachment.type?.startsWith("video/")) {
                return `<video class="media" src="${escapeAttr(attachment.dataUrl)}" controls playsinline></video>`;
            }
            if (attachment.type?.startsWith("audio/")) {
                return `<audio class="media" src="${escapeAttr(attachment.dataUrl)}" controls></audio>${attachment.transcript ? `<div class="empty">Yaziya dokum: ${escapeHtml(attachment.transcript)}</div>` : ""}`;
            }
            return `<a class="meta" href="${escapeAttr(attachment.dataUrl)}" download="${name}">${name}</a>`;
        }

        $("loadButton").onclick = load;
        $("refreshButton").onclick = load;
        $("deleteAllButton").onclick = deleteAll;
        $("adminSearch").oninput = render;
        document.querySelectorAll(".tab").forEach(tab => {
            tab.onclick = () => {
                state.view = tab.dataset.view;
                render();
            };
        });
        load();
    </script>
</body>
</html>
